# Final notes:
# - Ensure database schema for Kamailio (usrloc, auth, domain, aliases, dispatcher etc.) is created.
#   Kamailio provides scripts like 'kamdbctl create' for this.
# - Replace placeholders like YOUR_PUBLIC_IP, DBURL, MEDIASERVER_ASTERISK, DOMAIN.
# - Adjust 'children' count and other performance parameters based on server resources.
# - Configure TLS certificates properly if using TLS, WS, WSS.
# - Test thoroughly, especially NAT traversal and dispatcher logic.
# - This configuration is a starting point and may need further customization
#   based on specific requirements of the VoIP Business Solution.
# - The document's Kamailio config was a mix of older and newer styles. This is an attempt
#   to modernize and structure it while keeping the intent.
# - PSTN and LOCATION routes from the document are very generic. Their actual implementation
#   depends heavily on how they integrate with Asterisk or other media/PSTN gateways.
#   They are largely incorporated into TO_MEDIASERVER or need specific dispatcher groups.
# - The `failure_reply_mode` for TM is set to 3, which is stateful.
# - `t_relay()` is the primary function for forwarding requests statefully.
# - `loose_route()` is key for in-dialog request handling.
# - `record_route()` is essential for dialog-forming requests.
# - `save("location")` and `lookup("location")` are for registrar and user lookup.
# - `auth_check()` and `auth_challenge()` for authentication.
# - `rtpproxy_offer()` and `rtpproxy_answer()` for RTPProxy.
# - `ds_select_dst()` for dispatcher.
# - Ensure `kamailio.cfg` has correct permissions and Kamailio user can read it.
# - The original document had some syntax that might be for older Kamailio versions or specific modules
#   not standardly used (e.g. `$`avp(oexten) = `$rU;`). These are translated to modern equivalents or noted.
# - `FLB_NATSIPPING` flag value was changed from original document to avoid potential conflict with `FLT_NATS`.
# - The `PSTN` and `LOCATION` routes from the document were very generic. They are now more integrated
#   into the `TO_MEDIASERVER` logic or would require specific dispatcher groups if Kamailio routes them directly.
#   The current setup assumes media servers like Asterisk handle the final user lookup or PSTN breakout.
# - The `RELAY` route from the document is effectively `t_relay()` after necessary setup (like destination selection).
#   So, a separate `route[RELAY]` is not strictly needed if `t_relay()` is called directly.
#   The event routes (t_on_branch, t_on_reply, t_on_failure) are used instead for managing branches/replies/failures.
