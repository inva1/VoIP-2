# Placeholder for User Location service from original document
# This typically means looking up a user in usrloc and relaying
route[LOCATION] {
    # This is implicitly handled by TO_MEDIASERVER if it looks up local users.
    # If TO_MEDIASERVER sends to Asterisk, Asterisk does the final lookup.
    # If Kamailio is to do a direct usrloc lookup and then relay:
    if ($rU =~ "^[0-9]{2}$") { # Example: 2-digit extension dialing
        if (alias_db_lookup("dbaliases")) { # Check DB aliases first
            xlog("L_INFO", "Alias found for $rU, routing via SIPOUT (or specific route)\n");
            route(SIPOUT); # Or route(TO_MEDIASERVER) if alias points to local user
            exit;
        }
    }

    if (!lookup("location")) {
        xlog("L_WARN", "User $rU not found in location database.\n");
        # $var(rc) = $rc; # Store lookup return code
        # route(TOVOICEMAIL); # Example: route to voicemail if not found
        sl_send_reply("404", "Not Found (User Not Online)");
        exit;
    }

    xlog("L_INFO", "User $rU found. Relaying call.\n");
    # If lookup() is successful, $du is set.
    # NAT manage and relay
    route(NATMANAGE);
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


# Manage outgoing branches (called by t_on_branch)
branch_route[MANAGE_BRANCH] {
    xlog("L_DBG", "New branch [$T_branch_idx] to $ru (URI: $T_req_uri)\n");
    # NAT management for each branch if needed (e.g., if branches go via different RTPProxies)
    # route(NATMANAGE); # Usually NATMANAGE is done before branching or in request_route.
    return;
}

# Manage incoming replies (called by t_on_reply)
onreply_route[MANAGE_REPLY] {
    xlog("L_DBG", "Incoming reply: $rs - $rr for $fu to $tu\n");
    if (status=~"[12][0-9][0-9]") { # For 1xx and 2xx replies
        route(NATMANAGE); # Engage RTPProxy for SDP in 18x/200ok
    }
    # Add any custom reply handling here
    return;
}

# Manage failure routing cases (called by t_on_failure)
failure_route[MANAGE_FAILURE] {
    xlog("L_WARN", "Call failure: $rs - $rr for $T_reply_ru. Route $T_route_idx\n");

    # NAT management for failure handling if needed (e.g. if retrying via different path)
    # route(NATMANAGE);

    if (t_is_canceled()) {
        xlog("L_INFO", "Failure route: Transaction was canceled.\n");
        exit;
    }

    # Block call redirect based on 3xx replies (unless explicitly allowed)
    if (t_check_status("3[0-9][0-9]")) {
        xlog("L_INFO", "Failure route: Received 3xx reply, not redirecting by default.\n");
        # If you want to allow redirection for specific 3xx, add logic here.
        # For now, treat as failure.
        # t_reply("404", "Not found"); # Or let the original 3xx pass if TM handles it.
        exit;
    }

    # Example: Serial forking to voicemail on busy or timeout
    # if (t_check_status("486|408")) { # Busy or Timeout
    #    xlog("L_INFO", "Failure route: Call was busy or timed out. Routing to Voicemail (placeholder).\n");
    #    route(TOVOICEMAIL); # Placeholder route
    #    exit;
    # }

    # If dispatcher was used and failed over to another destination, it might re-enter request_route.
    # Or, you can try another dispatcher group here.
    # Example: Try PSTN GW group 2 if media server group 1 failed.
    # if ($avp(dsgrp) == 1 && t_check_status("503|408|480|486")) { # Failed from group 1
    #    xlog("L_INFO", "Media server group 1 failed, trying PSTN GW group 2\n");
    #    if (ds_select_dst("2", "4")) {
    #        t_replicate(); # Replicate the transaction to the new destination
    #        route(RELAY);  # Use t_relay() after ds_select_dst
    #        exit;
    #    }
    # }

    xlog("L_INFO", "Failure route: No further actions for this failure.\n");
    return;
}


