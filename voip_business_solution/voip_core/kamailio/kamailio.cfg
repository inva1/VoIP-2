####### Routing Logic #########

# Main request processing route
request_route {
    xlog("L_INFO", "Received $rm from $si:$sp to $ru ($T_branch_idx)\n");

    # Per request initial checks
    route(REQINIT);

    # NAT detection
    route(NATDETECT);

    # Handle requests within SIP dialogs (ACK, BYE, re-INVITE, UPDATE, PRACK)
    if (has_totag()) {
        route(WITHINDLG);
        exit;
    }

    # Handle CANCEL requests statefully
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            t_relay();
        } else {
            sl_send_reply("481", "Transaction Does Not Exist");
        }
        exit;
    }

    # Preload Route-tag for loose routing on initial requests
    t_check_trans(); # Can be used to detect retransmissions

    # Handle retransmissions statelessy if not already handled by t_check_trans() or TM
    # if (t_precheck_trans()) {
    #    xlog("L_DBG", "Retransmission detected, silently dropping.\n");
    #    exit;
    # }

    # Authentication for initial requests (REGISTER, INVITE, SUBSCRIBE, etc.)
    # Allow OPTIONS without auth for endpoint probing (e.g. by dispatcher)
    if (!is_method("OPTIONS") || $au!=$null) { # $au is auth username
        route(AUTH);
    }

    # Record routing for dialog forming requests (INVITE, SUBSCRIBE)
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Accounting for INVITEs
    if (is_method("INVITE")) {
        setflag(FLT_ACC); # Mark for accounting
    }

    # Dispatch requests to foreign domains (upstream carriers, other SIP entities)
    if (uri == myself) {
        # Request is for a local domain Kamailio is authoritative for
        # Handle presence related requests
        # route(PRESENCE); # Uncomment if using presence module

        # Handle registrations
        if (is_method("REGISTER")) {
            route(REGISTRAR);
            exit;
        }

        # If RURI has no username (e.g. INVITE sip:example.com)
        if ($rU == $null) {
            sl_send_reply("484", "Address Incomplete");
            exit;
        }

        # Dispatch to PSTN Gateways / Media Servers (e.g., Asterisk)
        # This is where you'd use the dispatcher module
        # Example: Route to Asterisk for local users or PSTN termination
        route(TO_MEDIASERVER);

        # User location service if not handled by TO_MEDIASERVER
        # route(LOCATION); # This was in the original document

    } else {
        # Request is for a foreign domain (SIP Trunking, Federation)
        route(SIPOUT);
    }

    # Fallback if no route matched (should not happen with proper TO_MEDIASERVER or SIPOUT)
    xlog("L_WARN", "Request for $ru did not match any specific routing block.\n");
    sl_send_reply("404", "Not Found (No Route)");
    exit;
}


# Per SIP request initial checks
route[REQINIT] {
    # Max forwards check
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Respond to OPTIONS requests locally if for Kamailio itself (keepalive)
    if (is_method("OPTIONS") && uri == myself && $rU == $null) {
        sl_send_reply("200", "Kamailio is Alive");
        exit;
    }

    # Sanity checks for SIP headers and structure
    if (!sanity_check("1511", "7")) { # Strict checks
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        # Consider sl_send_reply("400", "Bad Request") or just drop.
        exit;
    }

    # Anti-flood detection (PIKE module)
    # if (pike_check_req()) {
    #    xlog("L_WARN", "PIKE: Flood detected from $si:$sp - dropping request\n");
    #    # Consider adding to htable ipban here
    #    # htable_set("ipban", "$si", "1");
    #    sl_send_reply("503", "Service Unavailable (Rate Limit)");
    #    exit;
    # }

    # Check for source IP in blacklist (htable 'ipban')
    # if (htable_get("ipban", "$si", "$avp(is_banned)")) {
    #    if ($avp(is_banned) != NULL) {
    #        xlog("L_WARN", "IP $si is banned, dropping request\n");
    #        # Silently drop or send 403 Forbidden
    #        exit;
    #    }
    # }
}

# Caller NAT detection route (simplified from original)
route[NATDETECT] {
    force_rport(); # Always set rport, helps with NAT
    if (nat_uac_test("19")) { # Test for NAT features (RFC 3581, symmetric RTP, etc.)
        xlog("L_INFO", "NAT detected for $fu (IP: $si:$sp)\n");
        setflag(FLT_NATS); # Mark as NATed client

        if (is_method("REGISTER")) {
            fix_nated_register();
            # Optional: Set Path header for NATed clients if Path module is used
            # if (registrar.use_path) { path_set(); }
        } else {
            # For other methods like INVITE, ensure correct contact
            if (is_first_hop()) { # Check if Kamailio is the first hop
                 set_contact_alias(); # Alias the contact to reflect received IP/port
            }
        }
        # If using RTPProxy, this is a good place to engage it for NATed clients
        # route(NATMANAGE); # Call NATMANAGE if RTPProxy is needed here
    }
}

# RTPProxy control and signaling updates for NAT traversal
route[NATMANAGE] {
    if (!is_method("INVITE|ACK|BYE|UPDATE|PRACK")) { # Only manage RTP for these methods
        return;
    }

    # Check if NAT is involved (either client NATed or we force RTPProxy)
    # You might have a flag $var(force_rtpproxy) or check FLT_NATS
    if (!isflagset(FLT_NATS) && !($ru =~ "rtpproxy_forced_user")) { # Example condition
         # return; # Uncomment to only use RTPProxy for NATed clients
    }

    if (is_request()) {
        if (has_body("application/sdp")) {
            if (rtpproxy_offer("cor")) { # Manage SDP offer, "cor" = change origin and ICE remove
                xlog("L_INFO", "RTPProxy engaged for offer from $si for $ru\n");
            } else {
                xlog("L_ERR", "Error engaging RTPProxy for offer\n");
                sl_send_reply("500", "RTPProxy Offer Error");
                exit;
            }
        }
    } else { # Is a reply
        if (has_body("application/sdp")) {
            if (rtpproxy_answer("cor")) { # Manage SDP answer
                xlog("L_INFO", "RTPProxy engaged for answer to $si for $ru\n");
            } else {
                xlog("L_ERR", "Error engaging RTPProxy for answer\n");
                # Replies cannot be failed this way typically, error is logged.
            }
        }
    }

    # Update Contact for replies if NAT was involved
    if (is_reply() && isbflagset(FLB_NATB)) { # FLB_NATB might be set if callee is NATed
         set_contact_alias();
    }
}


# Handle requests within SIP dialogs
route[WITHINDLG] {
    # Security: drop if sequential request doesn't match existing dialog
    if (!t_check_trans_dialog()) { # Extension of t_check_trans for dialogs
        if (!($rm == "ACK" && t_check_status("408|481|407"))) { # Allow ACK for specific error replies
            xlog("L_WARN", "Potential stray $rm for non-existent dialog $dlg_id from $si\n");
            sl_send_reply("481", "Dialog/Transaction Does Not Exist");
            exit;
        }
    }

    if (loose_route()) {
        xlog("L_INFO", "Loose routing $rm to $du ($T_branch_idx)\n");

        # NAT Management for in-dialog requests
        route(NATMANAGE); # Engage RTPProxy if needed for re-INVITEs, UPDATEs

        if (is_method("BYE")) {
            setflag(FLT_ACC); # Account BYE
            setflag(FLT_ACCMISSED); # Account even if transaction fails (for dialog accounting)
        } else if (is_method("ACK")) {
            # ACK is forwarded statelessy after loose_route finds the path
            # NATMANAGE above would have handled SDP if present in 200ok's ACK
        } else if (is_method("NOTIFY")) {
            # Add Record-Route for in-dialog NOTIFY as per RFC 6665.
            record_route();
        }

        if (!t_relay()) {
            sl_reply_error();
        }
    } else {
        # No loose route for in-dialog request - this is unusual
        # Could be ACK for 4xx reply if transport changed or other edge cases
        if (is_method("ACK")) {
            xlog("L_INFO", "ACK without loose_route, checking transaction.\n");
            if (t_check_trans()) {
                # This ACK is probably for a 4xx (e.g. 487 Request Terminated)
                # or a 2xx reply to INVITE that was already processed by TM.
                # TM will handle relaying it.
                t_relay(); # Should be handled by TM if transaction exists
                exit;
            } else {
                xlog("L_WARN", "Stateless ACK without matching transaction, dropping.\n");
                exit; # Drop ACK if no transaction
            }
        }
        xlog("L_WARN", "No loose_route for in-dialog $rm from $si to $ru. Sending 404.\n");
        sl_send_reply("404", "Not Found (No Route Within Dialog)");
    }
    exit;
}

# Authentication route
route[AUTH] {
    # For REGISTER, always authenticate
    if (is_method("REGISTER")) {
        if (!auth_check("$fd", "subscriber", "1", "0")) { # realm, table, flags, extra_auth
            auth_challenge("$fd", "0"); # realm, flags (0 = no qop)
            exit;
        }
        consume_credentials(); # Remove Authorization header after successful auth
        xlog("L_INFO", "User $au successfully authenticated for REGISTER.\n");
        return;
    }

    # For other methods (INVITE, SUBSCRIBE, etc.)
    # Allow calls from trusted sources (e.g., your Asterisk) without authentication
    # if (src_ip_is_trusted()) { return; } # Requires permissions module and trusted table

    if (!auth_check("$fd", "subscriber", "1", "0")) {
        auth_challenge("$fd", "0");
        exit;
    }
    consume_credentials();
    xlog("L_INFO", "User $au successfully authenticated for $rm.\n");
    # Optional: Check if user is active in your backend DB via RPC/HTTP request if needed
}

# REGISTRAR processing
route[REGISTRAR] {
    if (!is_method("REGISTER")) return;

    if (isflagset(FLT_NATS)) { # If client is NATed
        setbflag(FLB_NATB); # Mark this branch as NATed
        setbflag(FLB_NATSIPPING); # Enable NAT SIP PING for this contact
    }

    if (!save("location")) { # Save contact to location DB
        sl_reply_error(); # Send error reply on failure
    } else {
        xlog("L_INFO", "Registered $fu with contact $ct expires $expires\n");
    }
    exit;
}

# Route to Media Server (e.g., Asterisk)
route[TO_MEDIASERVER] {
    xlog("L_INFO", "Routing call for $rU@$rd to Media Server\n");

    # Here you can implement logic to select a media server using Dispatcher
    # Example: Round-robin to a group of Asterisk servers (group 1)
    if (!ds_select_dst("1", "4")) { # Group 1, algorithm 4 (round-robin)
        xlog("L_ERR", "No Media Server available in group 1\n");
        send_reply("503", "Service Unavailable (No Media Server)");
        exit;
    }
    xlog("L_INFO", "Dispatching to Media Server $du via group $dsg (Dst: $dsi)\n");

    # NAT management if media server is behind NAT or if RTP needs to be anchored
    route(NATMANAGE); # Engage RTPProxy for calls going to/from media server

    # Forward the request to the selected media server
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


# Routing to foreign domains (SIP Trunks, Federation)
route[SIPOUT] {
    if (uri == myself) return; # Should not happen if called correctly

    xlog("L_INFO", "Routing call for $ru to foreign domain (SIPOUT)\n");
    append_hf("P-hint: outbound\r\n"); # Optional hint for downstream proxies

    # NAT management if Kamailio is behind NAT and needs to manage RTP for outbound calls
    route(NATMANAGE);

    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}


# Placeholder for PSTN routing logic from original document
