#!KAMAILIO
# Enhanced Kamailio Configuration for VoIP Business Solution
# Version 2.0

####### Global Parameters #########
# Debugging
#debug=3
#log_stderror=yes # Use for debugging, disable in production

# Logging
log_facility=LOG_LOCAL0
log_level=2 # 0=errors, 1=warnings, 2=info, 3=debug
# For production, consider log_level=1 or 0 and use syslog for log management.

# Performance
fork=yes
children=8 # Adjust based on expected load and CPU cores (e.g., 2x to 4x cores)
# For high load, consider increasing children, e.g., 16, 32, or even more.
# Ensure 'open files' limit (ulimit -n) is high enough for Kamailio.

# SIP settings
# Advertise addresses and ports Kamailio listens on
# Auto-detection might work, but explicit is safer.
# Replace with your actual public IP if behind NAT, or use advertised_address global param.
# listen=udp:YOUR_PUBLIC_IP:5060 advertise YOUR_PUBLIC_IP:5060
# listen=tcp:YOUR_PUBLIC_IP:5060 advertise YOUR_PUBLIC_IP:5060
# listen=tls:YOUR_PUBLIC_IP:5061 advertise YOUR_PUBLIC_IP:5061
# listen=ws:YOUR_PUBLIC_IP:8080 advertise YOUR_PUBLIC_IP:8080
# listen=wss:YOUR_PUBLIC_IP:8443 advertise YOUR_PUBLIC_IP:8443

# If Kamailio is on a machine with a single public IP, this is simpler:
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
# For TLS, WS, WSS, ensure certs are configured (see tls.cfg include or direct params)
listen=tls:0.0.0.0:5061
listen=ws:0.0.0.0:8080  # For WebRTC clients using WebSocket
listen=wss:0.0.0.0:8443 # For WebRTC clients using Secure WebSocket

# If behind NAT and Kamailio doesn't know its public IP:
# mhomed=1 # Enable multi-homed support if needed
# advertised_address="YOUR_PUBLIC_IP"
# advertised_port="5060" # Or the relevant port for the transport

auto_aliases=no # Recommended for security and predictability
dns_try_ipv6=yes # If your network supports IPv6
check_via=on
rev_dns=no # Disable reverse DNS lookups for performance unless strictly needed

# TCP/TLS specific settings
tcp_accept_no_cl=yes
tcp_connection_lifetime=3605
tcp_max_connections=4096 # Adjust based on expected TCP clients

# SIP Timer Defaults (can be overridden by TM module params)
# Default values are usually fine, adjust if specific issues arise.

