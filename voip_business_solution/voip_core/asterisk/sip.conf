;
; SIP Configuration for Asterisk (chan_sip or pjsip)
; This configuration is based on the provided document which seems to use chan_sip.
; For new deployments, PJSIP is generally recommended over chan_sip.
; If PJSIP is intended, the syntax would be different (pjsip.conf).
; Assuming chan_sip based on the document's format.
;

[general]
; Context for incoming calls if no specific context is found for the peer
context=default ; Default context for incoming calls

; Allow or disallow overlapping DTMF digits. Default is yes.
; Setting to 'no' can prevent issues with some devices.
allowoverlap=no

; Network interface and port for SIP signaling
udpbindaddr=0.0.0.0:5060 ; Listen on all IPv4 interfaces on UDP port 5060
                         ; The document specifies 0.0.0.0 without port, but port is implied by default.
                         ; For clarity, adding :5060.
tcpenable=yes            ; Enable TCP support for SIP
tcpbindaddr=0.0.0.0:5060 ; Listen on all IPv4 interfaces on TCP port 5060

; Transports to use (udp, tcp, tls, ws, wss)
; For WebRTC, ws (WebSocket) and wss (Secure WebSocket) are needed.
transport=udp,tcp,ws,wss

; Enable DNS SRV record lookups for outbound calls
srvlookup=yes

; Type of Service (ToS) / Differentiated Services Code Point (DSCP) for SIP packets
tos_sip=cs3       ; AF31 (DSCP 26, PHB CS3) - signaling
tos_audio=ef      ; EF (DSCP 46, PHB EF) - voice media (RTP)
tos_video=af41    ; AF41 (DSCP 34, PHB AF41) - video media (RTP)

; 802.1p Class of Service (CoS) for SIP and media (if supported by network hardware)
cos_sip=3
cos_audio=5
cos_video=4

; NAT (Network Address Translation) settings
; These are crucial if Asterisk is behind a NAT router.
nat=force_rport,comedia ; force_rport: Always reply to the source port.
                        ; comedia: Send media to the IP/port Asterisk receives media from.
                        ; Other options: auto_force_rport, auto_comedia, yes, no, never
                        ; 'yes' is equivalent to force_rport,comedia.
                        ; The document uses 'force_rport,comedia' which is common.

externip=YOUR_PUBLIC_IP ; Your server's public IP address.
                        ; Required if Asterisk is behind NAT. Replace with actual IP.
                        ; Can also use externhost=your.hostname.com if IP is dynamic (requires DNS updates)
; externrefresh=10      ; How often to refresh externhost (in seconds)

localnet=10.0.0.0/8         ; Define local networks to identify NAT scenarios.
localnet=172.16.0.0/12
localnet=192.168.0.0/16
; Add any other private network ranges your Asterisk server might interact with directly.

; Security settings
allowguest=no             ; Disallow calls from anonymous SIP users. Recommended.
alwaysauthreject=yes      ; Reject with 401/407 instead of 403 on auth failure. Helps clients.
autocreatepeer=no         ; Do not automatically create peers for unknown incoming registrations.
                          ; Security risk if enabled.
; allowtransfer=no        ; Disallow call transfers by default (can be overridden per peer)
; callcounter=yes         ; Enable call counters for use with 'sip show peer <name>'

; SIP Timers (default values are usually fine, adjust if needed)
registertimeout=20        ; Timeout for REGISTER requests (seconds). Default 20.
registerattempts=10       ; Number of REGISTER attempts before failing. Default 0 (infinite, not recommended).
                          ; Document uses 10.
defaultexpiry=120         ; Default registration expiry time (seconds). Document uses 120.
                          ; Can be overridden by clients.
minexpiry=60              ; Minimum allowed registration expiry. Document uses 60.
maxexpiry=3600            ; Maximum allowed registration expiry. Document uses 3600.
; session-timers=originate ; Enable session timers (RFC 4028). Options: originate, accept, refuse.
; session-expires=1800    ; Max session refresh interval (seconds)
; session-minse=90        ; Min session refresh interval (seconds)
; session-refresher=uas   ; Who refreshes the session by default (uas, uac)

; Codec preferences
; Disallow all codecs first, then allow specific ones in preferred order.
disallow=all
allow=ulaw                ; G.711 u-law (North America, Japan)
allow=alaw                ; G.711 A-law (Rest of the world)
allow=gsm                 ; GSM codec (lower bandwidth, mobile quality)
allow=g726                ; G.726 ADPCM (various bitrates)
allow=g722                ; G.722 wideband codec (7kHz audio)
allow=opus                ; Opus codec (versatile, high quality, good for WebRTC)
; Other common codecs: g729 (licensed), speex, ilbc

; WebRTC support (specific to chan_sip, PJSIP handles this differently)
; These settings are relevant if Asterisk is directly handling WebRTC clients via chan_sip.
; The document's architecture might imply a WebRTC gateway (Janus) in front.
; If Janus handles WebRTC termination, these might not be needed directly in Asterisk's chan_sip.
; However, the document includes them in sip.conf.
websocket_enabled=yes     ; Enable WebSocket support for chan_sip.
                          ; Requires Asterisk to be compiled with WebSocket support.
; rtptimeout=60           ; RTP timeout in seconds (default 60)
; rtpholdtimeout=300      ; RTP hold timeout (default 300)
; rtpkeepalive=<secs>     ; Send RTP keepalives
encryption=yes            ; Enable SRTP for media encryption (for WebRTC/secure calls)
                          ; Requires an SRTP library (e.g., libsrtp)
;icesupport=yes           ; Enable ICE support for NAT traversal (for WebRTC)
                          ; This is generally better handled by a dedicated WebRTC gateway.
                          ; Document has this in the webrtc-template.

; Database integration for realtime peers/users (if not using static config)
; These settings enable Asterisk to load peer/user info from a database via Asterisk Realtime Architecture (ARA).
rtcachefriends=yes        ; Cache realtime friends (peers) in memory.
rtsavesysname=yes         ; Save systemname with realtime peers (for multi-Asterisk setups).
rtupdate=yes              ; Allow updates to realtime peers/users to take effect without reload.
rtautoclear=yes           ; Auto-clear cached realtime peers if they expire from DB.
                          ; 'yes' means clear immediately. Can also be a time in seconds.
                          ; Document has this twice, once under [general] and once in a template.

; Kamailio Integration
; This registers Asterisk as a "user" or "gateway" to Kamailio.
; Kamailio will then route calls for this user/gateway to Asterisk.
; Replace 'voip_user', 'password', and 'kamailio.voipconnect.com' with actual values.
register => voip_user:password@kamailio.voipconnect.com/voip_user
; The '/voip_user' at the end is the contact extension Kamailio should use for this registration.
; It helps Kamailio know which Asterisk instance this is if multiple register.

; Peer definition for Kamailio (where Asterisk expects calls from Kamailio)
[kamailio]
type=peer                 ; Defines this as a peer (for both incoming and outgoing calls)
host=kamailio.voipconnect.com ; Kamailio's IP address or hostname
port=5060                 ; Kamailio's SIP port
qualify=yes               ; Send OPTIONS requests to check if Kamailio is reachable
                          ; qualifyfreq = 60 ; How often to qualify (seconds)
insecure=port,invite      ; Do not require authentication for INVITEs or from this port.
                          ; 'port' means trust any source port.
                          ; 'invite' means do not require auth for initial INVITEs.
                          ; This is common when Asterisk is behind a trusted proxy like Kamailio.
context=from-kamailio     ; Context in extensions.conf for calls coming from Kamailio
; disallow=all            ; Codecs can be set here or inherited from general
; allow=ulaw
; allow=alaw
; allow=opus
; dtmfmode=rfc2833        ; DTMF mode for calls with Kamailio

; PSTN Gateway configurations
; These are examples. Replace with your actual PSTN provider details.

[pstn-us-gateway]
type=peer
host=us-gateway.provider.com ; Provider's SIP server hostname or IP
;username=your_username     ; Your account username with the provider
;secret=your_password       ; Your account password
;fromuser=your_username     ; Username to use in From: header
;fromdomain=us-gateway.provider.com ; Domain to use in From: header
; insecure=port,invite    ; May not be needed if provider requires auth.
                          ; If provider uses IP auth, host must be their specific IP.
qualify=yes
context=from-pstn         ; Context for incoming calls from this PSTN gateway
dtmfmode=rfc2833          ; Common DTMF mode for PSTN
; disallow=all
; allow=ulaw              ; Common codec for US PSTN
; allow=g729              ; Often used for PSTN to save bandwidth (licensed)
; progressinband=never    ; Control in-band progress tones
; directmedia=no          ; Don't allow media to bypass Asterisk for this peer

[pstn-uk-gateway]
type=peer
host=uk-gateway.provider.com
;username=your_username
;secret=your_password
;fromuser=your_username
;fromdomain=uk-gateway.provider.com
qualify=yes
context=from-pstn
dtmfmode=rfc2833
; disallow=all
; allow=alaw              ; Common codec for UK PSTN
; allow=ulaw

[pstn-ng-gateway] ; Nigeria PSTN Gateway
type=peer
host=ng-gateway.provider.com
;username=your_username
;secret=your_password
;fromuser=your_username
;fromdomain=ng-gateway.provider.com
qualify=yes
context=from-pstn
dtmfmode=rfc2833
; disallow=all
; allow=alaw
; allow=ulaw
; allow=gsm               ; GSM might be common in some regions

; WebRTC client template
; This template defines common settings for WebRTC users.
; Users can then inherit from this template.
[webrtc-template](!)      ; The (!) marks this as a template
type=friend               ; Allows both incoming and outgoing calls for these users
                          ; 'peer' for outgoing, 'user' for incoming, 'friend' for both.
transport=ws,wss          ; Specify WebSocket transports
encryption=yes            ; Enable SRTP (media encryption)
avpf=yes                  ; Enable AVPF (Audio-Visual Profile with Feedback) for RTP/SAVPF
icesupport=yes            ; Enable ICE for NAT traversal
context=authenticated-users ; Default context for authenticated WebRTC users
directmedia=no            ; Media should pass through Asterisk (no direct peer-to-peer media)
                          ; 'yes' or 'nonat' might be used if clients are on same NAT-less network.
disallow=all
allow=opus                ; Opus is highly recommended for WebRTC
allow=ulaw
allow=alaw
; host=dynamic            ; For users registering from dynamic IPs
; dtlsenable=yes          ; Enable DTLS-SRTP (older method, encryption=yes uses SDES-SRTP)
; dtlsverify=fingerprint  ; Verify DTLS certificates via fingerprint
; dtlscertfile=/path/to/cert.pem
; dtlsprivatekey=/path/to/key.pem
; dtlscafile=/path/to/ca.pem
; dtlssetup=actpass       ; How to handle DTLS setup (active, passive, actpass)

; Dynamic user registration from database (Realtime)
; The document has another [general] section here with ARA settings.
; These are usually placed in the main [general] section at the top.
; If this is meant to be a separate peer type for ARA users, it needs a unique name.
; Assuming these are duplicates or intended for the main [general] ARA setup.
; [general-realtime-users] ; Example of a different section name if needed
; rtcachefriends=yes
; rtsavesysname=yes
; rtupdate=yes
; rtautoclear=yes

; Example of a dynamic user that might be loaded from ARA, inheriting webrtc-template
; [user1001](webrtc-template)
; secret=password1001
; callerid="User 1001" <1001>

; Ensure that the externip is correctly set if Asterisk is behind NAT.
; The `YOUR_PUBLIC_IP` placeholder must be replaced.
; For WebRTC, ensure Asterisk is compiled with support for WebSockets and SRTP.
; The Kamailio integration (register statement and [kamailio] peer) is crucial.
; PSTN gateway configurations are highly dependent on the provider.
; The webrtc-template provides a good starting point for WebRTC users.
; If using PJSIP, all of this configuration would look very different.
; This file assumes chan_sip is the active SIP channel driver.
; Check Asterisk logs for any errors related to SIP configuration after loading/reloading.
; Use `sip show settings` and `sip show peers` in Asterisk CLI to verify.
