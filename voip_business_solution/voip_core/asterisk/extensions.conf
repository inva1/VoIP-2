;
; Asterisk Dialplan (extensions.conf)
; VoIP Business Solution - Enhanced
;

[general]
static=yes                ; Load dialplan statically at startup. Default is yes.
writeprotect=no           ; Allow CLI commands to modify the dialplan.
                          ; Default is no. For production, consider 'yes' if dialplan is managed by files only.
autofallthrough=yes       ; If an extension runs out of steps, try exten 's', then 'h', then hang up.
                          ; Default is yes.
clearglobalvars=no        ; Clear global variables on reload. Default is no.
                          ; Set to 'yes' if you want a clean slate on reload, but can break things.
; priorityjumping=yes     ; Allow jumping to priorities other than n+1. Default is yes.

; Custom dynamic features (e.g., for call parking, blind transfer)
; See features.conf for more details.
; parkedcalltransfers = system ; or 'caller', 'callee'
; blindtransfer = ##      ; DTMF sequence for blind transfer
; atxfer = *2             ; DTMF sequence for attended transfer

[globals]
; Define global variables that can be used throughout the dialplan.
CONSOLE=Console/dsp       ; Console channel for testing (e.g., Dial(CONSOLE/1))
IAXINFO=guest             ; Default IAX username for some applications
TRUNK=DAHDI/G2            ; Example DAHDI trunk group (if using DAHDI hardware)
TRUNKMSD=1                ; Example for DAHDI trunk message waiting indication

; Custom global variables for PSTN gateways (match names in sip.conf)
PSTN_US_GATEWAY=SIP/pstn-us-gateway
PSTN_UK_GATEWAY=SIP/pstn-uk-gateway
PSTN_NG_GATEWAY=SIP/pstn-ng-gateway

; AGI script paths (assuming they are in the standard agi-bin directory)
AGI_ROUTE_CALL=route-call.py
AGI_HANDLE_INCOMING=handle-incoming.py

; Default context for calls that don't match any other context
[default]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(all)} to ${EXTEN} in default context)
exten => _X.,n,Verbose(1, Unhandled call in 'default' context: ${EXTEN} from ${CALLERID(num)})
exten => _X.,n,Goto(authenticated-users,${EXTEN},1) ; Attempt to route to authenticated users context
exten => _X.,n,Hangup()

; Context for authenticated users (e.g., WebRTC clients, registered SIP phones)
[authenticated-users]
; Internal calling between users (assuming usernames are numeric or alphanumeric)
; This pattern matches extensions like '1001', 'user007', etc.
exten => _[a-zA-Z0-9_]+,1,NoOp(Internal call from ${CALLERID(num)} to user ${EXTEN})
exten => _[a-zA-Z0-9_]+,n,Set(TARGET_USER=${EXTEN}) ; Store target user for AGI or further logic
; Add logic here to check if TARGET_USER is allowed to be called by CALLERID(num)
; e.g., using an AGI script or database lookup based on subscriptions.
exten => _[a-zA-Z0-9_]+,n,Dial(SIP/${TARGET_USER},30,Ttr) ; Dial SIP peer, 30s timeout, allow transfer, report RTCP
exten => _[a-zA-Z0-9_]+,n,Goto(s-${DIALSTATUS},1) ; Jump to handler based on dial status

; Dial status handlers for internal calls
exten => s-NOANSWER,1,NoOp(Call to ${TARGET_USER} was not answered)
exten => s-NOANSWER,n,Hangup()
exten => s-BUSY,1,NoOp(Call to ${TARGET_USER} was busy)
exten => s-BUSY,n,VoiceMail(${TARGET_USER}@default,b) ; Example: send to voicemail if busy
exten => s-BUSY,n,Hangup()
exten => s-CONGESTION,1,NoOp(Call to ${TARGET_USER} faced congestion)
exten => s-CONGESTION,n,Hangup()
exten => s-CHANUNAVAIL,1,NoOp(Call to ${TARGET_USER} channel unavailable)
exten => s-CHANUNAVAIL,n,Hangup()
exten => s-ANSWER,1,NoOp(Call to ${TARGET_USER} answered)
exten => s-ANSWER,n,Hangup() ; Hangup after successful call, unless more logic is needed
exten => _s-.,1,NoOp(Unhandled dial status ${DIALSTATUS} for ${TARGET_USER})
exten => _s-.,n,Hangup()


; Outbound calling rules based on dialed number patterns
; These rules depend on user subscriptions and are simplified here.
; A full implementation would involve checking subscription status via AGI or FuncODBC.

; US/Canada calling (1 + 10 digits)
exten => _1NXXNXXXXXX,1,NoOp(US/Canada call attempt from ${CALLERID(num)} to ${EXTEN})
; Add AGI/DB lookup here to verify user's subscription allows US/Canada calls
; Example: exten => _1NXXNXXXXXX,n,AGI(check-subscription.py,${CALLERID(num)},US)
;          exten => _1NXXNXXXXXX,n,GotoIf($["${AGI_RESULT}" = "DENIED"]?hangupcall)
exten => _1NXXNXXXXXX,n,Set(CALLERID(num)=${CALLERID(num)}) ; Ensure outbound CID is set correctly
                                                       ; May need to be set to user's assigned DID
exten => _1NXXNXXXXXX,n,Dial(${PSTN_US_GATEWAY}/${EXTEN},60,Ttr)
exten => _1NXXNXXXXXX,n,Hangup()
; exten => _1NXXNXXXXXX,n(hangupcall),Hangup() ; For AGI denial


; UK calling (44 + number)
exten => _44X.,1,NoOp(UK call attempt from ${CALLERID(num)} to ${EXTEN})
; Add AGI/DB lookup for UK subscription
exten => _44X.,n,Set(CALLERID(num)=${CALLERID(num)}) ; Set outbound CID
exten => _44X.,n,Dial(${PSTN_UK_GATEWAY}/${EXTEN},60,Ttr)
exten => _44X.,n,Hangup()

; Nigeria calling (234 + number)
exten => _234X.,1,NoOp(Nigeria call attempt from ${CALLERID(num)} to ${EXTEN})
; Add AGI/DB lookup for Nigeria subscription
exten => _234X.,n,Set(CALLERID(num)=${CALLERID(num)}) ; Set outbound CID
exten => _234X.,n,Dial(${PSTN_NG_GATEWAY}/${EXTEN},60,Ttr)
exten => _234X.,n,Hangup()

; International calling (other countries, prefixed with + or 00)
; The document uses `_+.` which might be too broad or need adjustment.
; Let's use `_00X.` for 00 prefix and handle `+` by stripping it.
exten => _+X.,1,NoOp(International call attempt (stripping +) from ${CALLERID(num)} to ${EXTEN})
exten => _+X.,n,Goto(international-prefix-routing,${EXTEN:1},1) ; Strip '+' and go to common handler

exten => _00X.,1,NoOp(International call attempt (00 prefix) from ${CALLERID(num)} to ${EXTEN})
exten => _00X.,n,Goto(international-prefix-routing,${EXTEN:2},1) ; Strip '00' and go to common handler

[international-prefix-routing]
; This context receives the number *without* the international prefix (+ or 00)
; ${EXTEN} here is, e.g., 1NXXNXXXXXX for US, 44... for UK, 234... for Nigeria
exten => _X.,1,NoOp(Routing international call (prefix stripped) from ${CALLERID(num)} to ${EXTEN})
; Use AGI script for complex routing based on country code and user subscription
; This AGI script needs to determine the correct PSTN gateway and if user is allowed.
exten => _X.,n,AGI(${AGI_ROUTE_CALL},${CALLERID(num)},${EXTEN})
; AGI_ROUTE_CALL should set channel variables like:
; - ROUTE_ALLOWED (YES/NO)
; - ROUTE_GATEWAY (e.g., PSTN_US_GATEWAY, PSTN_UK_GATEWAY)
; - ROUTE_NUMBER (the number to dial on the gateway, might be modified by AGI)
; - OUTBOUND_CID (caller ID to use for the outbound leg)
exten => _X.,n,GotoIf($["${ROUTE_ALLOWED}" = "NO"]?hangupcall)
exten => _X.,n,Set(CALLERID(num)=${OUTBOUND_CID})
exten => _X.,n,Dial(${ROUTE_GATEWAY}/${ROUTE_NUMBER},60,Ttr)
exten => _X.,n,Hangup()
exten => _X.,n(hangupcall),NoOp(Call denied by AGI script)
exten => _X.,n,Hangup()


; Context for calls coming from Kamailio (registered users or proxied calls)
[from-kamailio]
exten => _X.,1,NoOp(Call from Kamailio: ${CALLERID(all)} to ${EXTEN})
exten => _X.,n,Set(CHANNEL(language)=en) ; Set default language for prompts
; Here, ${EXTEN} is the destination user/number Kamailio wants to reach.
; This could be an internal user or an outbound number.
exten => _X.,n,Goto(authenticated-users,${EXTEN},1) ; Route to main user context

; Context for incoming calls from PSTN gateways
[from-pstn]
exten => _X.,1,NoOp(Incoming PSTN call to DID ${EXTEN} from ${CALLERID(num)})
exten => _X.,n,Set(CHANNEL(language)=en)
; ${EXTEN} is the DID number that was called.
; ${CALLERID(num)} is the external caller's number.
; Use AGI script to look up the DID, find the assigned user, and route accordingly.
exten => _X.,n,AGI(${AGI_HANDLE_INCOMING},${EXTEN},${CALLERID(num)})
; AGI_HANDLE_INCOMING should set channel variables like:
; - FORWARD_TO_USER (e.g., SIP/user1001 or an external number if forwarding)
; - FORWARD_ALLOWED (YES/NO)
exten => _X.,n,GotoIf($["${FORWARD_ALLOWED}" = "NO"]?hangupcall)
exten => _X.,n,Dial(${FORWARD_TO_USER},30,Ttr) ; Dial the internal user or forwarded number
exten => _X.,n,Hangup()
exten => _X.,n(hangupcall),NoOp(Incoming PSTN call handling denied or failed for DID ${EXTEN})
exten => _X.,n,Hangup()

; Voicemail application access
exten => *97,1,NoOp(Voicemail main access for ${CALLERID(num)})
exten => *97,n,VoiceMailMain(${CALLERID(num)}@default) ; Access voicemail for the calling user
                                                    ; Assumes voicemail boxes are named after user extensions
                                                    ; and are in 'default' voicemail context (see voicemail.conf)
exten => *97,n,Hangup()

; Call recording feature (example: dial *1 to toggle recording)
; This is a simplified example. A more robust solution might use AMI or feature codes.
[feature-call-recording] ; Include this context where needed or use Goto
exten => *1,1,NoOp(Call recording toggle requested by ${CALLERID(num)})
exten => *1,n,Set(MONITOR_FILENAME=${UNIQUEID}-${STRFTIME(${EPOCH},,%Y%m%d-%H%M%S)}-${CALLERID(num)}-${EXTEN})
exten => *1,n,MixMonitor(${MONITOR_FILENAME}.wav,b) ; Record audio, 'b' for beep at start
exten => *1,n,Playback(beep) ; Play a beep to confirm
exten => *1,n,Return() ; Return to previous dialplan location

; Include the feature in relevant contexts:
; include => feature-call-recording
; inside [authenticated-users] for example.

; Conference rooms (example)
; See confbridge.conf for detailed conference room configuration.
[conference-rooms]
exten => 8000,1,NoOp(Conference room 8000 accessed by ${CALLERID(num)})
exten => 8000,n,ConfBridge(8000) ; Enter conference room named '8000'
exten => 8000,n,Hangup()

; Include contexts where appropriate
; For example, in [authenticated-users]:
; include => conference-rooms

; Hangup extension (useful for GotoIf and error handling)
exten => h,1,NoOp(Call hung up. CDR processing or cleanup can happen here.)
; Add any necessary cleanup, AGI scripts for CDR finalization, etc.
exten => h,n,Hangup()


; Notes:
; - Pattern matching: _X. (any digit), _NXX (digits 2-9 for N, 0-9 for X), _[a-zA-Z0-9_]+ (alphanumeric + underscore)
; - Applications: NoOp, Verbose, Goto, Dial, Hangup, Set, AGI, VoiceMail, MixMonitor, ConfBridge, Playback, Return.
; - Channel Variables: ${CALLERID(all)}, ${CALLERID(num)}, ${EXTEN}, ${DIALSTATUS}, ${UNIQUEID}, ${EPOCH}, ${CHANNEL(language)}.
; - AGI scripts (route-call.py, handle-incoming.py) are critical for dynamic logic based on the backend database
;   (user subscriptions, DID assignments, call permissions). These scripts need to be implemented.
; - CallerID for outbound calls needs careful management to ensure it's set to a valid DID assigned to the user.
; - Error handling and dial status (s-${DIALSTATUS}) are important for robust call flows.
; - This dialplan is a starting point. Complex IVRs, queues, advanced features would require more contexts and logic.
; - Remember to `dialplan reload` or `core reload` in Asterisk CLI after changes.
; - The document's `route-international` context is renamed to `international-prefix-routing` for clarity.
; - The `_+.` pattern for international calls was refined to handle `+` explicitly by stripping it.
; - The `*1` for call recording is a basic example. More sophisticated recording controls might be needed.
; - Ensure AGI scripts are executable and placed in Asterisk's agi-bin directory.
; - The `TRUNKMSD` and `IAXINFO` globals might not be relevant if not using IAX or specific DAHDI features.
; - The use of `Goto(s-${DIALSTATUS},1)` is a common pattern for handling dial outcomes.
; - Context `[default]` now tries to forward unhandled calls to `[authenticated-users]`.
; - The `Dial` application options `Ttr` mean:
;   T: Allow the called party to transfer the call.
;   t: Allow the calling party to transfer the call.
;   r: Generate ringing to the calling party (use with care, may conflict with early media).
; Consider `G` for proceed if call is answered, `g` to continue dialplan execution if callee hangs up.
; `M(macro-name)` for running a macro on answer.
; - This dialplan assumes that user extensions (for internal calling and voicemail) are consistent
;   (e.g., numeric like 1001, 1002 or alphanumeric matching SIP peer names).
; - The `writeprotect=no` can be a security concern if Asterisk CLI is exposed.
;   For production, set to `yes` if all dialplan changes are done via file edits and reloads.
