;
; Asterisk configuration file
;
; This file includes general options for Asterisk.
; Specific module configurations are in their respective .conf files (e.g., sip.conf, extensions.conf)
;

[directories](!) ; Use a (!) template to define default paths that can be overridden.
; These paths are standard for most Linux installations. Adjust if your Asterisk installation is different.
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk
astkeydir => /var/lib/asterisk
astdatadir => /var/lib/asterisk
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk ; Or /run/asterisk on some systems
astlogdir => /var/log/asterisk
astsbindir => /usr/sbin

[options]
; General Options
; ---------------
; verbose = 3             ; Console verbosity. Higher is more verbose. Default is 0.
                          ; Set to 3-5 for debugging, lower for production.
; debug = 3               ; Console debug level. Similar to verbose.
                          ; Set to 3-5 for debugging, lower for production.
; alwaysfork = yes        ; Run as a daemon (fork into background). Default is no.
                          ; For production, typically yes. For debugging, no.
nofork = no               ; Equivalent to alwaysfork = yes if set to no.
                          ; To run in foreground for debugging, set nofork = yes.
quiet = no                ; Run quietly (suppress output to console). Default is no.
                          ; For daemon mode, this doesn't matter much.
; console = yes           ; Enable the Asterisk console. Default is no if run as daemon.
                          ; Useful for live debugging with 'asterisk -r'.
; highpriority = yes      ; Run with high process priority. Default is yes.
                          ; Recommended for real-time audio processing.
; initcrypto = yes        ; Initialize crypto keys at startup. Default is no.
                          ; Useful if using encrypted formats or secure RTP.
; nocolor = no            ; Disable console color codes. Default is no.
; dontwarn = no           ; Disable warnings for deprecated features. Default is no.
                          ; Keep this as 'no' to see important warnings.
; dumpcore = no           ; Dump core on crash. Default is no.
                          ; Enable for debugging crashes, but ensure ulimits allow core dumps.
languageprefix = yes      ; Use language prefix for sound files (e.g., en/filename). Default is yes.
defaultlanguage = en      ; Default language for prompts if not specified.
documentation_language = en_US ; Language for CLI command documentation.

; System Name (useful if running multiple Asterisk instances or for logging)
systemname = voip-asterisk-01 ; As per document
autosystemname = no       ; Do not automatically set systemname from hostname. Default is yes.

; DTMF Settings
mindtmfduration = 80      ; Minimum DTMF duration in ms. Default is 80.
; maxdtmlfduration = xxx  ; Maximum DTMF duration (if needed)
; dtmfmode = rfc2833      ; Default DTMF mode (can be overridden per channel/peer)

; Other settings
; cache_media_frames = yes ; Cache media frames to reduce CPU load (default yes)
; transmit_silence = yes  ; Transmit silence during muted calls (default yes for compatibility)
; transcode_via_slin = yes ; Transcode via SLINEAR by default (default yes)

; Process limits (ensure these are set appropriately at the OS level too)
; maxcalls = 1000         ; Maximum concurrent calls. Default is based on system resources.
                          ; Set based on expected load and server capacity.
; maxload = 0.9           ; Asterisk will stop accepting new calls if load average exceeds this.
                          ; Default is no load limit. Set based on server CPU.
; maxfiles = 1000         ; Maximum open file descriptors Asterisk can use.
                          ; Default is system limit. Ensure ulimit -n is high enough.

; Live AGI execution timeout
; agi_exec_timeout = 3000 ; Default timeout for AGI script execution in ms (3 seconds)

; Default context for chan_unistim
; unistimcontext = unistim-default

; Default context for chan_misdn
; misdn_default_context = misdn-default

; Default context for chan_alsa
; alsadefaultcontext = alsa-default

; Default context for chan_oss
; ossdefaultcontext = oss-default

; Control socket (for 'asterisk -r')
; astctl = asterisk.ctl ; Name of the control socket file in astrundir.

; Enable live call DAHDI channel monitoring via AMI/CLI
; dahdimon = yes

; Custom Event Logging
; custom_events = yes ; Enable custom events for specific modules if needed.

; Build related settings (usually not changed)
; build_user = asterisk
; build_group = asterisk
; build_host = myhost.example.com
; build_kernel = 2.6.32-xxxx
; build_machine = x86_64
; build_os = Linux
; build_date = YYYY-MM-DD

; The document provides specific values for some of these options.
; Let's ensure those are reflected or noted.
verbose = 3               ; From document
debug = 3                 ; From document
alwaysfork = yes          ; From document (implies nofork=no)
                          ; Setting nofork=no as per document's intent.
console = yes             ; From document (allows 'asterisk -r')
highpriority = yes        ; From document
initcrypto = yes          ; From document
timestamp = yes           ; From document (prefix log messages with timestamp)
execincludes = yes        ; From document (allow #exec in config files - use with caution)

; Note: The paths like astetcdir are usually correct by default.
; The template `(!)` means these are defaults that can be overridden
; in a file like `asterisk.conf.local` or by Asterisk itself if compiled differently.
; For this exercise, we assume standard paths.
; The document's `systemname` and `autosystemname` are included.
; `mindtmfduration`, `defaultlanguage`, `documentation_language` are also from the document.
; `nofork = no` and `quiet = no` are consistent with `alwaysfork = yes` and default behavior.
; `languageprefix = yes` is default and also in the document.
; `nocolor = no` and `dontwarn = no` are defaults and good practice.
; `dumpcore = no` is default and from the document.

; It's good practice to keep this file relatively clean and use module-specific
; .conf files for most configurations.
; Check `asterisk -cvvv` output for any warnings or errors after changes.
; Use `core show settings` in Asterisk CLI to see current values.
