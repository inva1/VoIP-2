# Notes:
# - These are example rules. Real-world rules need to be tailored to the specific metrics
#   exposed by your application and infrastructure, and your operational requirements.
# - Metric names like `voip_active_users_total`, `voip_calls_total_count`, `voip_kyc_pending_verifications_total`
#   are placeholders and need to be implemented in your `voip-backend` Flask application's
#   Prometheus exporter (e.g., using `prometheus_client` or `prometheus_flask_exporter`).
# - Adjust thresholds, `for` durations, labels, and annotations as needed.
# - Ensure Alertmanager is configured to handle these alerts (e.g., send notifications via email, Slack, PagerDuty).
# - Test rules thoroughly.
# - For business metrics, consider what is truly actionable as an alert versus what should be on a dashboard.
