# Nginx Configuration for VoIP Enterprise Dashboard (admin.voipconnect.com)
# This configuration is based on the provided document and adapted for a typical SPA.

# Upstream backend servers (Flask/Gunicorn)
# Assumed to be defined globally or in main nginx.conf.
# See user_app/nginx.conf for an example if needed here.
# upstream backend-servers {
#     least_conn;
#     server 10.0.1.10:5000 max_fails=3 fail_timeout=30s;
#     server 10.0.1.11:5000 max_fails=3 fail_timeout=30s;
#     server 10.0.1.12:5000 max_fails=3 fail_timeout=30s;
# }

server {
    listen 80;
    listen [::]:80;
    server_name admin.voipconnect.com; # Replace with your actual admin domain

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.voipconnect.com; # Replace with your actual admin domain

    # SSL Configuration (Paths are examples, replace with your actual certificate paths)
    ssl_certificate /etc/letsencrypt/live/admin.voipconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.voipconnect.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off; # As per document
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # OCSP Stapling (Recommended)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/admin.voipconnect.com/chain.pem;
    # resolver 8.8.8.8 8.8.4.4 valid=300s;
    # resolver_timeout 5s;

    # Enhanced security headers for admin interface (from document)
    add_header X-Frame-Options "DENY" always; # Stricter than SAMEORIGIN
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always; # Good default
    # Content-Security-Policy from document (more restrictive for admin)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
    # WARNING: 'unsafe-inline' for script-src and style-src is generally discouraged.
    # It's better to use nonces, hashes, or avoid inline scripts/styles if possible.
    # This is taken directly from the document; review for actual implementation.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # IP whitelist for admin access (optional, from document)
    # Ensure these IPs are correct and this doesn't lock out legitimate admins.
    # allow 203.0.113.0/24; # Office network example
    # allow 198.51.100.0/24; # VPN network example
    # deny all; # This must be the last entry in this block if using IP whitelist

    # Document root for the React Enterprise Dashboard application
    root /opt/voip-enterprise-dashboard-enhanced/dist; # As per document
    index index.html index.htm;

    # Basic Authentication for admin interface (from document)
    # This provides an additional layer of security.
    # The .htpasswd file needs to be created and managed separately.
    # Command: htpasswd -c /etc/nginx/.htpasswd admin_username
    auth_basic "VoIP Admin Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd; # Ensure this path is secure and Nginx can read it.

    # Gzip compression (similar to user_app)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/xml+rss application/json image/svg+xml;
    gzip_comp_level 6;
    gzip_buffers 16 8k;

    # Handle client-side routing for SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend servers with admin authentication context
    location /api/ {
        # If IP whitelisting is used for the whole site, it applies here too.
        # If Basic Auth is used for the whole site, it applies here too.
        # No separate auth_basic here unless you want a different realm or user file for API.

        proxy_pass http://backend-servers; # Name of the upstream block

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the authenticated user from auth_basic to the backend (from document)
        proxy_set_header X-Admin-User $remote_user; # $remote_user is set by auth_basic module

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static assets caching (similar to user_app)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        root /opt/voip-enterprise-dashboard-enhanced/dist;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Notes:
# - Replace `admin.voipconnect.com` with your actual admin domain.
# - Ensure SSL certificates are correctly configured.
# - The `/opt/voip-enterprise-dashboard-enhanced/dist` path should point to your admin app's build output.
# - The `auth_basic_user_file /etc/nginx/.htpasswd` requires `htpasswd` to be set up.
# - The Content-Security-Policy with 'unsafe-inline' should be reviewed for security implications.
# - If using IP whitelisting, ensure it's correctly configured and doesn't block necessary access.
# - Test configuration with `sudo nginx -t`.
