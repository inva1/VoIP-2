# Nginx Configuration for VoIP User Application (app.voipconnect.com)
# This configuration is based on the provided document and adapted for a typical SPA.

# Upstream backend servers (Flask/Gunicorn)
# This should match the `upstream backend-servers` block from the document.
# It's often better to define upstreams at the http level if shared across server blocks.
# For this specific file, we'll assume it's self-contained or include it.
# upstream backend-servers {
#     least_conn;
#     server 10.0.1.10:5000 max_fails=3 fail_timeout=30s;
#     server 10.0.1.11:5000 max_fails=3 fail_timeout=30s;
#     server 10.0.1.12:5000 max_fails=3 fail_timeout=30s;
# }

server {
    listen 80;
    listen [::]:80;
    server_name app.voipconnect.com; # Replace with your actual domain

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.voipconnect.com; # Replace with your actual domain

    # SSL Configuration (Paths are examples, replace with your actual certificate paths)
    ssl_certificate /etc/letsencrypt/live/app.voipconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.voipconnect.com/privkey.pem;

    # Stronger SSL protocols and ciphers (from document)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384; # Added one from security section
    ssl_prefer_server_ciphers off; # 'off' as per document, 'on' is often recommended with a strong cipher list.
                                  # If 'on', server dictates cipher choice from its list if client supports it.
                                  # If 'off', client's preferred cipher (if on server list) is chosen.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off; # Recommended for Perfect Forward Secrecy

    # OCSP Stapling (Improves SSL handshake speed and privacy)
    # ssl_stapling on;
    # ssl_stapling_verify on;
    # ssl_trusted_certificate /etc/letsencrypt/live/app.voipconnect.com/chain.pem; # Path to CA chain
    # resolver 8.8.8.8 8.8.4.4 valid=300s; # Google DNS or your preferred resolver
    # resolver_timeout 5s;

    # Security Headers (from document)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always; # Note: Modern browsers may ignore this; CSP is preferred.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always; # Document uses this. "strict-origin-when-cross-origin" is often a good default.
    # Content-Security-Policy from document (adjust as needed for your app's resources)
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline';" always;
    # Consider a more restrictive CSP, e.g., explicitly listing CDNs, API endpoints.
    # 'unsafe-inline' for styles/scripts should be avoided if possible by using nonces or hashes.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; # HSTS

    # Document root for the React application (frontend build files)
    # Adjust the path to where your React app's 'build' or 'dist' folder is served from.
    root /opt/voip-user-app-enhanced/dist; # As per document
    index index.html index.htm;

    # Gzip compression (from document)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024; # Don't gzip very small files
    gzip_proxied expired no-cache no-store private must-revalidate auth; # Proxy conditions
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/xml+rss application/json image/svg+xml;
    gzip_comp_level 6; # Compression level (1-9)
    gzip_buffers 16 8k;
    # gzip_disable "MSIE [1-6]\."; # Disable for old IE if necessary

    # Handle client-side routing for Single Page Applications (SPAs)
    # All requests for non-existent files are directed to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend servers
    # The upstream block should be defined globally in nginx.conf or in this file if not.
    # For this example, assume `backend-servers` is defined elsewhere or uncomment above.
    location /api/ {
        proxy_pass http://backend-servers; # Name of the upstream block

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme; # http or https

        # Timeouts for proxy
        proxy_connect_timeout 30s; # As per document
        proxy_send_timeout 30s;    # As per document
        proxy_read_timeout 30s;    # As per document

        # Buffer settings (optional, can be tuned)
        # proxy_buffering on;
        # proxy_buffers 8 16k;
        # proxy_buffer_size 32k;
        # proxy_busy_buffers_size 64k;

        # Add custom headers if needed by the backend
        # proxy_set_header X-Custom-Header "value";
    }

    # WebSocket proxy for real-time features (e.g., signaling for WebRTC)
    location /ws/ {
        proxy_pass http://backend-servers; # Or a dedicated WebSocket upstream/server

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for WebSockets (as per document)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
        # Note: 7 days is very long. Ensure this is intended and doesn't tie up resources.
        # Typical values might be 60s or configurable by the application via keep-alives.
    }

    # Static assets caching (from document)
    # Cache common static file types for a long time.
    # Assumes these files have hash-based names or query strings for cache busting.
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        root /opt/voip-user-app-enhanced/dist; # Explicitly set root again or ensure it's inherited
        try_files $uri =404; # Return 404 if static file not found
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off; # Disable access logging for static assets if desired
    }

    # Security: Deny access to hidden files (e.g., .git, .htaccess)
    location ~ /\. {
        deny all;
    }

    # Optional: Favicon and robots.txt handling
    # location = /favicon.ico {
    #     log_not_found off;
    #     access_log off;
    # }
    # location = /robots.txt {
    #     log_not_found off;
    #     access_log off;
    # }

    # Error pages (optional, customize as needed)
    # error_page 404 /404.html;
    # location = /404.html {
    #     internal;
    # }
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     internal;
    # }
}

# It's crucial to define the `upstream backend-servers` block.
# If it's not in the main nginx.conf, you can include it here, outside the server blocks:
#
# http {
#     upstream backend-servers {
#         least_conn;
#         server 10.0.1.10:5000 max_fails=3 fail_timeout=30s;
#         server 10.0.1.11:5000 max_fails=3 fail_timeout=30s;
#         server 10.0.1.12:5000 max_fails=3 fail_timeout=30s;
#     }
#
#     # ... include other http level configs ...
#
#     # then include this server block file or paste its content here.
# }
#
# For this file to be standalone and testable with `nginx -t -c <path_to_this_file>`,
# it would need the http block and upstream definition if not globally available.
# However, Nginx configurations are usually structured with a main nginx.conf
# that includes configurations from sites-available/.
# This file is assumed to be one such included configuration.
#
# Replace `app.voipconnect.com` with your actual domain name.
# Ensure SSL certificates are correctly paths and installed.
# The `/opt/voip-user-app-enhanced/dist` path should point to your React app's build output.
# Test configuration with `sudo nginx -t` before reloading/restarting Nginx.
