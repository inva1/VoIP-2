# Redis Configuration for VoIP Business Solution
# Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)

# Network Configuration
# Bind to specific interfaces for production.
# The example shows loopback and an internal IP.
# Adjust 10.0.1.100 to the actual internal IP of the Redis server.
bind 127.0.0.1 -::1 # Bind to loopback by default for security
# To bind to a specific internal IP, uncomment and set the correct IP:
# bind 127.0.0.1 10.0.1.100

port 6379
protected-mode yes

# Memory Configuration
# Set maxmemory appropriate to your server's RAM.
# 8gb is given as an example.
maxmemory 8gb
maxmemory-policy allkeys-lru # Evict keys using an LRU algorithm

# Persistence Configuration
# Default RDB persistence settings from the document:
save 900 1    # Save if at least 1 key changed in 900 seconds (15 minutes)
save 300 10   # Save if at least 10 keys changed in 300 seconds (5 minutes)
save 60 10000 # Save if at least 10000 keys changed in 60 seconds (1 minute)

# AOF persistence can be enabled for higher durability if needed,
# but is not specified in the document for this section.
# appendonly no (default)

# Security Configuration
# Set a strong password in production.
# The document uses 'your_redis_password_here' as a placeholder.
# This should be set via environment variable or a secure configuration management tool.
# requirepass your_redis_password_here

# It's good practice to rename dangerous commands, especially in less trusted environments.
# The document suggests disabling them entirely by renaming to an empty string.
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# Logging
logfile "/var/log/redis/redis-server.log" # Ensure this directory exists and has correct permissions
loglevel notice

# Advanced settings (defaults are often fine, but consider these for tuning)
# tcp-keepalive 300
# maxclients 10000 (default is 10000, adjust if needed)

# Slow Log - useful for debugging slow commands
# slowlog-log-slower-than 10000 # microseconds (10ms)
# slowlog-max-len 128           # Number of items in the slow log

# General
daemonize yes # Run as a daemon, common for production
pidfile /var/run/redis_6379.pid # Ensure this path is writable by the Redis user
dir /var/lib/redis # Directory for RDB/AOF files. Ensure correct permissions.

# Note: Installation steps like `sudo apt install redis-server` and
# `sudo nano /etc/redis/redis.conf` are actions for the server administrator.
# This file represents the *content* of redis.conf.
# The actual password should be managed securely, not hardcoded here.
# For the Flask app, the REDIS_URL will connect to this Redis instance.
# e.g., REDIS_URL = 'redis://:your_redis_password_here@10.0.1.100:6379/0'
# or REDIS_URL = 'redis://:your_redis_password_here@localhost:6379/0' if on the same machine.
