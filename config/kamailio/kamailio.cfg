####### Routing Logic #########
# Main request routing block.
request_route {

    # Per-request initial checks
    route(REQINIT);

    # NAT detection
    route(NATDETECT);

    # Handle CANCEL requests
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Handle requests within SIP dialogs (e.g., BYE, re-INVITE)
    # This should come before authentication for in-dialog requests
    if (has_totag()) {
        route(WITHINDLG);
        # If route(WITHINDLG) decided to exit, we won't reach here.
        # If it didn't handle the request (e.g. sequential request not matching loose_route),
        # it might fall through. Ensure WITHINDLG handles or exits.
        # The provided WITHINDLG route does exit or relay.
    }

    # Handle retransmissions statelessly if possible, or pass to TM
    if (t_precheck_trans()) {
        # t_check_trans(); # This would make it stateful. For stateless retransmission handling, this might not be needed here.
                          # The example has t_check_trans(); exit; - This means it's likely for TM to handle it.
        t_check_trans();
        exit;
    }
    # If it's a new transaction, TM will create it.
    # If t_precheck_trans was false, it's a new request for TM.
    if (!t_check_trans()) {
        # This seems redundant if t_precheck_trans is used correctly.
        # The original config has t_check_trans() without ! before it.
        # Let's stick to the original:
        # t_check_trans(); # This would create a transaction if one does not exist.
    }
    # The example has t_check_trans() then another t_check_trans()
    # This is unusual. Let's assume the first one is for pre-checking
    # and the second one is for ensuring TM handles it.
    # The original config:
    # if(t_precheck_trans()) { t_check_trans(); exit; }
    # t_check_trans();
    # This implies: if it's a known transaction (retransmission), TM handles it and exits.
    # Otherwise (new request), TM creates a server transaction.


    # Authentication for initial requests (not within a dialog)
    # The AUTH route itself checks if from_uri!=myself && uri!=myself for non-REGISTER
    route(AUTH);

    # Record routing for dialog-forming requests (e.g., INVITE, SUBSCRIBE)
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Accounting for INVITEs
    if (is_method("INVITE")) {
        setflag(FLT_ACC); # Mark for accounting
    }

    # Dispatch requests to foreign domains (external SIP URIs)
    if (uri != myself) { # Check if R-URI is for a remote domain
        route(SIPOUT);
        exit; # SIPOUT route should handle relaying or exit
    }

    # Requests for local domains / users
    if (uri == myself) {
        # Handle presence-related requests (PUBLISH, SUBSCRIBE)
        if (is_method("PUBLISH|SUBSCRIBE")) {
            route(PRESENCE);
            exit; # PRESENCE route should handle or exit
        }

        # Handle registrations
        if (is_method("REGISTER")) {
            route(REGISTRAR);
            exit; # REGISTRAR route should handle or exit
        }

        # If R-URI has no username (e.g., INVITE sip:example.com)
        if ($rU == $null) {
            sl_send_reply("484", "Address Incomplete");
            exit;
        }

        # Dispatch destinations to PSTN Gateways (handled by Asterisk via dispatcher)
        # This logic might be more complex, involving checking if the user is allowed PSTN
        # The example PSTN route uses dispatcher, implying Asterisk/FreeSWITCH are listed there.
        # This could also be where you decide if a call is on-net or off-net.
        # For now, assuming LOCATION handles finding local users first.
        # If not found locally, it might then go to PSTN.
        # The provided example has PSTN before LOCATION. This means it tries PSTN first for $rU.
        # This seems counterintuitive if $rU is a local user.
        # Let's assume the intent is: if lookup("location") fails, then try PSTN.
        # The original structure: route(PSTN) then route(LOCATION) if $rU is not null.
        # This might mean specific numbers are routed to PSTN by pattern first.

        # The document structure:
        # route(PRESENCE);
        # route(REGISTRAR);
        # if ($rU==$null) { ... }
        # route(PSTN);
        # route(LOCATION);
        # This implies PSTN is tried for *any* non-REGISTER/non-Presence with a $rU.
        # This needs careful consideration. If PSTN is for outbound only, this is too broad.
        # Let's assume PSTN route has its own checks (e.g. prefix based).

        route(PSTN); # Tries to route via PSTN gateway (e.g. based on dialed number pattern)
                     # The PSTN route itself should have logic to select only relevant numbers.
                     # If PSTN route doesn't match/handle, it should fall through or explicitly not exit.
                     # The example PSTN route *exits*. This means if it matches, LOCATION is not tried.

        # User location service (find registered local users)
        route(LOCATION); # Tries to find the user in usrloc
                         # If found, relays. If not, might send to voicemail or error.
        exit; # LOCATION route should handle relaying or erroring.
    }

    # Should not reach here if logic is correct, but as a fallback:
    send_reply("500", "Internal Routing Error");
    exit;
}


####### Authentication Route #########
route[AUTH] {
    # Authenticate REGISTER requests
    if (is_method("REGISTER")) {
        if (!auth_check("$fd", "subscriber", "0")) { # $fd = From domain
            auth_challenge("$fd", "0");
            exit;
        }
        # User authenticated for REGISTER - remove auth header
        consume_credentials();
        return; # Successfully authenticated REGISTER
    }

    # For other initial requests (e.g. INVITE, SUBSCRIBE) to our domain
    if (uri == myself) {
        if (from_uri == myself) {
            # Request is from a local user (authenticated by usrloc contact or other means)
            # No explicit auth check here, assuming if from_uri is local, it's trusted
            # Or, could do a lookup to see if from_uri is a valid registered user.
            # This part needs to be robust. For now, trusting if from_uri is local.
            return;
        } else {
            # Request is from outside to a local user/service. Authenticate the caller.
            if (!auth_check("$au", "subscriber", "0")) { # $au = Auth username
                                                         # Using $au, not $fd, for non-REGISTER
                auth_challenge("$fd", "0"); # Challenge based on From domain
                exit;
            }
            # User authenticated - remove auth header
            consume_credentials();
            return;
        }
    } else {
        # Relaying calls to other domains (uri != myself)
        # The document's example:
        # if (from_uri!=myself && uri!=myself) {
        #    sl_send_reply("403", "Not relaying");
        #    exit;
        # }
        # This means if From is not local AND To is not local, deny relay.
        # This is a good basic anti-relay check.
        if (from_uri != myself) { # Implicitly uri != myself due to outer if-else
            sl_send_reply("403", "Relay Denied");
            exit;
        }
        # If from_uri == myself but uri != myself, it's an outbound call from a local user.
        # Authentication for this should have happened before (e.g. if required for outbound).
        # The main request_route calls AUTH before SIPOUT.
        # So, if from_uri == myself, it would have passed the (from_uri == myself) check above.
    }
}


####### Caller NAT Detection Route #########
route[NATDETECT] {
    force_rport(); # Forces Kamailio to respond to the source port
    if (nat_uac_test("19")) { # Test for NAT based on various criteria (19 is a combination)
        if (is_method("REGISTER")) {
            fix_nated_register(); # Corrects Contact URI for NATed REGISTERs
            # set_contact_alias(); # May also be useful
        } else {
            # For non-REGISTER requests from NATed UACs
            if(is_first_hop()) { # Check if Kamailio is the first hop
                 set_contact_alias(); # Alias the contact to hide NAT address if needed
            }
        }
        setflag(FLT_NATS); # Set flag indicating client is behind NAT
    }
    return;
}


####### RTPProxy Control & Signaling Updates for NAT Traversal #########
route[NATMANAGE] {
    if (is_request()) {
        if (has_totag()) { # In-dialog request
            if (check_route_param("nat=yes")) { # Check if nat=yes was added to Route by callee
                setbflag(FLB_NATB); # Mark that callee is NATed
            }
        }
    }

    if (!(isflagset(FLT_NATS) || isbflagset(FLB_NATB))) {
        # Neither caller nor callee seems to be NATed, or NAT handling not requested
        return;
    }

    # Engage RTPProxy
    # "co" means: c = change direction, o = offer
    # This should be symmetric: rtpproxy_manage("co") or rtpproxy_manage("ie")
    # The example uses "co".
    rtpproxy_manage("co");

    if (is_request()) {
        if (!has_totag()) { # Initial request (e.g. INVITE)
            if (t_is_branch_route()) { # If this is a branch route
                add_rr_param(";nat=yes"); # Add nat=yes to Record-Route for callee to see
            }
        }
    }

    if (is_reply()) {
        if (isbflagset(FLB_NATB)) { # If callee was marked as NATed
            # This part is tricky. set_contact_alias() on reply might not be what's needed.
            # Usually, contact in reply is from callee. If it's already fixed by callee's proxy, fine.
            # If RTPProxy is handling media relay for callee too, its IP should be in SDP.
            # The example has `set_contact_alias();` here.
            # This might be intended to rewrite the Contact in the reply if the callee is NATed
            # and its Contact needs to point to Kamailio/RTPProxy.
            # However, if RTPProxy is symmetric, it should handle media.
            # Let's keep it as per example, but this needs testing.
            if(isflagset(FLT_NATS)) { # If caller is also NATed
                 # This is a NAT-to-NAT scenario. RTPProxy is essential.
                 # The contact in reply should be fine if callee's proxy fixed it or if it's routable.
            }
            # The example has `set_contact_alias()` if FLB_NATB is set.
            # This suggests rewriting the contact even if only the callee is NATed.
            # This is usually done by `fix_nated_contact()` or similar.
            # `set_contact_alias()` typically aliases to Kamailio's IP.
            set_contact_alias();
        }
    }
    return;
}


####### URI Update for Dialog Requests (Loose Routing) #########
route[DLGURI] {
    if (!isdsturiset()) { # If destination URI is not set (e.g., after loose_route())
        handle_ruri_alias(); # Handle any aliasing on R-URI (e.g. if it was Contact)
    }
    return;
}


####### Routing to Foreign Domains (SIP Outbound) #########
route[SIPOUT] {
    # This route is called if uri != myself.
    # Basic check: ensure it's not an attempt to loop back.
    if (uri == myself) return; # Should not happen if called correctly

    append_hf("P-Hint: outbound\r\n"); # Optional: add a hint header

    # Here you might add other logic:
    # - Check if the user is authorized for outbound calls
    # - LCR (Least Cost Routing) if multiple outbound gateways
    # - Prepend prefixes if needed by your carrier

    route(RELAY); # Relay the request statelessly or statefully via TM
    exit;
}


####### PSTN Gateway Routing #########
# This route is assumed to be called for numbers that should go to PSTN.
# It uses the dispatcher module to select a PSTN gateway (e.g., Asterisk).
route[PSTN] {
    # Example: Use dispatcher group 1 for PSTN gateways.
    # Ensure your dispatcher table has entries for group 1.
    # "1" is group ID, "4" is algorithm (e.g., round-robin)
    if (!ds_select_dst("1", "4")) {
        send_reply("503", "No PSTN Gateway available"); # Service Unavailable
        exit;
    }

    # $du will be set to the selected destination URI by ds_select_dst.
    xlog("L_INFO", "Routing to PSTN GW: $du\n");

    # Set accounting flag if not already set (e.g. for non-INVITE PSTN calls if any)
    if (!isflagset(FLT_ACC)) {
        setflag(FLT_ACC);
    }

    # NAT management for the call leg towards PSTN gateway if needed.
    # The gateway itself might be behind NAT or require specific handling.
    # The example calls NATMANAGE. This implies RTPProxy might be used.
    route(NATMANAGE);

    # Relay the request to the selected PSTN gateway.
    # Use t_relay() for stateful forwarding.
    route(RELAY);
    exit;
}


####### REGISTRAR Processing #########
route[REGISTRAR] {
    # Already checked: is_method("REGISTER")
    if (!is_method("REGISTER")) return; # Defensive check

    if (isflagset(FLT_NATS)) { # If client is NATed (detected by NATDETECT)
        setbflag(FLB_NATB);    # Mark it for NAT handling (symmetric with NATMANAGE)
        # Enable SIP NAT pinging for this registration
        setbflag(FLB_NATSIPPING); # Nathelper will ping this client
    }

    # Save the registration to the location database (usrloc)
    if (!save("location")) {
        sl_reply_error(); # Send error reply if save failed
    }
    exit;
}


####### User Location Service (Usrloc) #########
route[LOCATION] {
    # Example for short dialing (2-digit extension) lookup in DB aliases
    # Adjust regex as needed.
    if ($rU =~ "^[0-9]{2}$") {
        if (alias_db_lookup("dbaliases")) { # Table name "dbaliases"
            xlog("L_INFO", "Found 2-digit extension $rU in dbaliases, routing to $du\n");
            route(SIPOUT); # Assuming alias points to a full URI, possibly external
            exit;
        }
    }

    # General DB-based alias lookup
    # if (alias_db_lookup("dbaliases")) { # Check if this should be different table or logic
    #     xlog("L_INFO", "Found $rU in dbaliases, routing to $du\n");
    #     route(SIPOUT); # Or route(RELAY) if $du is set correctly
    #     exit;
    # }
    # The example had two identical alias_db_lookup blocks. Assuming one was for specific pattern.

    $avp(oexten) = $rU; # Store original R-URI user part (extension)

    # Lookup the user in the location database (usrloc)
    if (!lookup("location")) {
        $var(rc) = $rc; # Store return code from lookup
        # Example: route to voicemail if user not found or not available
        # route(TOVOICEMAIL); # TOVOICEMAIL route not defined in example, placeholder
        # t_newtran(); # Create a new transaction for the reply

        switch ($var(rc)) {
            case -1: # Not Found
            case -3: # Error
                send_reply("404", "Not Found");
                break;
            case -2: # Timeout (if lookup had a timeout)
                send_reply("408", "Request Timeout (Usrloc)");
                break;
            # case -5: # Multiple contacts, if not handled by lookup strategy
            #    send_reply("485", "Ambiguous");
            #    break;
            default:
                send_reply("500", "Internal Error (Usrloc)");
        }
        exit;
    }

    # User found in usrloc. $du (destination URI) should be set.
    xlog("L_INFO", "User $rU found by usrloc, routing to $du\n");

    # Account for missed calls if INVITE and lookup was successful but callee doesn't answer
    # This flag is typically checked in a failure_route for t_reply.
    if (is_method("INVITE")) {
        setflag(FLT_ACCMISSED);
    }

    # Relay the call to the user.
    route(RELAY);
    exit;
}


####### Presence Server Processing #########
route[PRESENCE] {
    if (!is_method("PUBLISH|SUBSCRIBE")) return;

    if (is_method("SUBSCRIBE") && $hdr(Event) == "message-summary") {
        # MWI (Message Waiting Indication) SUBSCRIBE
        # route(TOVOICEMAIL); # Example: forward to a voicemail server
        # The example sends 404 if no voicemail service.
        sl_send_reply("404", "No Voicemail Service for MWI");
        exit;
    }

    if (!t_newtran()) { # Create a new transaction for PUBLISH/SUBSCRIBE
        sl_reply_error();
        exit;
    }

    if (is_method("PUBLISH")) {
        handle_publish(); # Kamailio's presence module handles PUBLISH
        t_release();      # Release transaction resources
    } else if (is_method("SUBSCRIBE")) {
        handle_subscribe(); # Kamailio's presence module handles SUBSCRIBE
        t_release();        # Release transaction resources
    }
    exit;
}


####### Wrapper for Relaying Requests (Stateful Forwarding) #########
route[RELAY] {
    # Enable event routes for forwarded requests (important for NAT, failures, etc.)
    if (is_method("INVITE|BYE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("branch_route")) { # If no branch_route is set
            t_on_branch("MANAGE_BRANCH"); # Set branch route handler
        }
    }
    if (is_method("INVITE|SUBSCRIBE|UPDATE")) {
        if (!t_is_set("onreply_route")) { # If no onreply_route is set
            t_on_reply("MANAGE_REPLY");   # Set reply route handler
        }
    }
    if (is_method("INVITE")) {
        if (!t_is_set("failure_route")) { # If no failure_route is set
            t_on_failure("MANAGE_FAILURE"); # Set failure route handler
        }
    }

    # Perform stateful relay using Transaction Manager (TM)
    if (!t_relay()) {
        sl_reply_error(); # Send error if relay fails
    }
    exit;
}


####### Per SIP Request Initial Checks #########
route[REQINIT] {
    # Max-Forwards header check to prevent loops
    if (!mf_process_maxfwd_header("10")) { # Allow max 10 hops through this proxy
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # Respond to stateless OPTIONS pings (e.g., from load balancers)
    if (is_method("OPTIONS") && uri == myself && $rU == $null) {
        sl_send_reply("200", "Keepalive");
        exit;
    }

    # Sanity checks for malformed messages
    # Parameters: checks_id (bitmask), uri_checks_id (bitmask)
    # "1511" and "7" are example values from some configurations.
    # Check Kamailio docs for specific meaning of sanity_check flags.
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP message from $si:$sp\n");
        # Consider sending a 400 Bad Request, but be careful not to aid attackers.
        # Dropping might be better.
        exit;
    }
    return;
}


####### Handle Requests Within SIP Dialogs #########
route[WITHINDLG] {
    # This route is called if has_totag() is true.
    if (!has_totag()) return; # Defensive check

    # Sequential requests within a dialog should follow Record-Route (loose routing)
    if (loose_route()) {
        route(DLGURI); # Update R-URI if needed (e.g., if Contact was aliased)

        # NAT management for in-dialog requests
        route(NATMANAGE); # Call NATMANAGE for media path updates

        if (is_method("BYE")) {
            setflag(FLT_ACC);       # Account BYE requests
            # setflag(FLT_ACCFAILED); # Account even if transaction fails (original had this)
                                    # This seems unusual for BYE unless it can fail meaningfully.
                                    # Let's keep it for now.
            setflag(FLT_ACCFAILED);
        } else if (is_method("ACK")) {
            # ACK is forwarded statelessy *after* INVITE dialog is established.
            # No TM handling for ACK here.
            # route(NATMANAGE); # NATMANAGE was already called above.
        } else if (is_method("NOTIFY")) {
            # Add Record-Route for in-dialog NOTIFY as per RFC 6665.
            record_route();
        }
        route(RELAY); # Relay the in-dialog request
        exit;
    }

    # If not loose_route() but it's an ACK (e.g., ACK for 4xx failure response)
    if (is_method("ACK")) {
        if (t_check_trans()) {
            # ACK for a transaction known to TM (e.g. 487 for CANCELed INVITE)
            # This ACK is stateful and should be relayed by TM.
            route(RELAY); # TM will handle relaying this ACK
            exit;
        } else {
            # ACK without matching transaction (e.g., stray ACK) - ignore and discard.
            exit;
        }
    }

    # If not loose_route() and not a recognized in-dialog method, reply 404.
    # This means the request is for this Kamailio instance but not part of an established dialog path.
    sl_send_reply("404", "Not Found (No Dialog Route)");
    exit;
}


####### Manage Outgoing Branches (for parallel forking) #########
# This route is called by TM for each new branch created during t_relay().
branch_route[MANAGE_BRANCH] {
    xlog("L_DBG", "New branch [$T_branch_idx] to $ru ($Ri:$Rp)\n");
    # $T_branch_idx is the index of the branch
    # $ru is the Request-URI for this branch
    # $Ri, $Rp are IP and Port for this branch

    # Perform NAT management for this specific branch if needed
    route(NATMANAGE);
    return;
}


####### Manage Incoming Replies #########
# This route is called by TM when a reply is received for a relayed request.
onreply_route[MANAGE_REPLY] {
    xlog("L_DBG", "Incoming reply: $rs - $rr for $fu from $si:$sp\n");
    # $rs = reply status code, $rr = reply reason phrase
    # $fu = From URI, $si = source IP, $sp = source port

    # Perform NAT management for replies (e.g., fix SDP if RTPProxy is used)
    if (status =~ "[12][0-9][0-9]") { # Only for provisional and success replies
        route(NATMANAGE);
    }
    return;
}


####### Manage Failure Routing Cases #########
# This route is called by TM when a transaction fails (e.g., timeout, 5xx reply).
failure_route[MANAGE_FAILURE] {
    xlog("L_WARN", "Transaction failure for $rm $ru: $T_reply_code - $T_reply_reason\n");
    # $rm = request method, $ru = request URI
    # $T_reply_code, $T_reply_reason are from the failure reply or TM internal status

    # Perform NAT management even on failure (e.g., to release RTPProxy resources)
    # route(NATMANAGE); # This might be needed if RTPProxy sessions need explicit teardown on failure.
                      # The example has it.

    if (t_is_canceled()) {
        # Transaction was canceled (e.g., BYE received before final response to INVITE)
        exit; # Nothing more to do
    }

    # Block call redirection based on 3xx replies if you don't want to follow them.
    # The example blocks them.
    if (t_check_status("3[0-9][0-9]")) {
        xlog("L_INFO", "Received 3xx reply, not redirecting. Sending 404 instead.\n");
        t_reply("404", "Not Found (Redirection Declined)"); # Send a 404 back to caller
        exit;
    }

    # Serial forking example: route to voicemail on busy or no answer (timeout)
    # This is a common use case for failure_route.
    # if (t_check_status("486|408")) { # 486 Busy Here, 408 Request Timeout
    #    xlog("L_INFO", "Call failed ($T_reply_code), trying voicemail for $ru\n");
    #    route(TOVOICEMAIL); # TOVOICEMAIL route not defined in example
    #    exit;
    # }

    # If you have other failure handling (e.g., try next gateway from dispatcher), do it here.
    # if (t_check_status("503")) { // Service Unavailable
    #    if (ds_next_dst()) {
    #        xlog("L_INFO", "PSTN GW failed, trying next one: $du\n");
    #        route(PSTN); // This would re-enter the PSTN route with next dest
    #        exit;
    #    }
    # }

    # If no other specific handling, the original failure reply will be sent by TM.
    return;
}

