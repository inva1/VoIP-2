#!KAMAILIO
# Kamailio Configuration File for VoIP Business Solution
# Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)

####### Global Parameters #########
# These parameters are crucial for Kamailio's operation.

# Debugging level (0-9, default 2). Higher values mean more verbose logging.
debug=2

# Log to stderr? (yes/no). 'no' is typical for production, relying on syslog.
log_stderror=no

# Syslog facility to use for logging. LOG_LOCAL0 is a common choice.
log_facility=LOG_LOCAL0

# Fork into daemon mode? (yes/no). 'yes' for production.
fork=yes

# Number of child processes to fork. Adjust based on server load and cores.
# Document specifies 8.
children=8

# Automatically create aliases for listening interfaces? (yes/no).
# 'no' is generally safer if you explicitly define listen interfaces.
auto_aliases=no

# Listening interfaces for SIP traffic.
# The document specifies UDP, TCP, TLS, WS, WSS.
# Using 0.0.0.0 to listen on all available IPv4 interfaces.
# Add IPv6 equivalents if needed, e.g., listen=udp:[::]:5060
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tls:0.0.0.0:5061
listen=ws:0.0.0.0:8080  # For WebRTC via WebSocket
listen=wss:0.0.0.0:8443 # For secure WebRTC via WebSocket

