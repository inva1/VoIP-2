# Make sure all custom flags (FLT_*, FLB_*) are defined if not standard:
# User-defined flags need to be declared using 'flag' keyword in kamailio.cfg,
# or manage them carefully. Standard flags like FLT_ACC are predefined.
# FLT_NATS, FLB_NATB, FLB_NATSIPPING, FLT_ACCMISSED
# These seem to be common conventions for user flags.
# Example:
# flag FLT_NATS            # Caller is behind NAT
# bflag FLB_NATB           # Callee is behind NAT (or branch is NATed)
# bflag FLB_NATSIPPING     # Enable NAT SIP Pinging for this registration

