; Supervisor configuration for VoIP Business Solution Backend
; Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)
;
; This file should typically be placed in /etc/supervisor/conf.d/voip-backend.conf
; (or /etc/supervisor.d/ on some systems)
;
; Ensure the user 'voip' and group 'voip' exist on the system.
; Ensure the directories /opt/voip-backend and /var/log/voip-backend exist and have correct permissions.

[program:voip-backend]
; Command to start the Gunicorn server.
; Assumes a virtual environment in /opt/voip-backend/venv
; and the Gunicorn config file is in /opt/voip-backend/gunicorn.conf.py
; 'run:app' should be your WSGI application object (e.g., in run.py, 'app = Flask(__name__)')
command=/opt/voip-backend/venv/bin/gunicorn -c /opt/voip-backend/gunicorn.conf.py run:app

; Directory where the application is located.
directory=/opt/voip-backend

; User and group to run the process as.
; Gunicorn config also specifies user/group; Supervisor can enforce it.
user=voip
group=voip

; Start the program automatically when Supervisor starts.
autostart=true

; Restart the program automatically if it exits unexpectedly.
autorestart=true

; Redirect standard error to standard output.
redirect_stderr=true

; Log file for standard output.
; Ensure the directory /var/log/voip-backend exists and is writable by the 'voip' user,
; or by the user Supervisor runs as if it creates the file.
stdout_logfile=/var/log/voip-backend/supervisor_stdout.log

; Maximum size of the log file before rotation.
stdout_logfile_maxbytes=50MB

; Number of backup log files to keep.
stdout_logfile_backups=10

; Environment variables for the process.
; FLASK_ENV=production ensures production settings are loaded by Flask (via config.py).
; You can add other necessary environment variables here, e.g.,
; SECRET_KEY, DATABASE_URL, REDIS_URL, JWT_SECRET_KEY, etc.
; It's often better to manage secrets outside this file (e.g., .env file loaded by app,
; or systemd environment files, or other secrets management tools).
; The document specifies FLASK_ENV=production.
environment=FLASK_ENV="production"
; Example:
; environment=FLASK_ENV="production",SECRET_KEY="your-production-secret-key",DATABASE_URL="postgresql://..."

; Number of seconds the program should be running before Supervisor considers it successfully started.
startsecs=10

; Number of times to retry starting the program if it fails to start.
startretries=3

; How long to wait before considering a process stopped (SIGCHLD).
stopwaitsecs=600 ; Default is 10, increased as per some recommendations, adjust as needed.

; Signal to send to stop the program (default is TERM).
; Gunicorn handles SIGTERM gracefully.
stopsignal=TERM

; Log level for this program's log events captured by Supervisor itself.
;loglevel=info ; Default is info.

; After making changes to this file, you need to tell Supervisor to re-read its configuration
; and update the process group:
; sudo supervisorctl reread
; sudo supervisorctl update
; sudo supervisorctl restart voip-backend
;
; Or for a specific group:
; sudo supervisorctl update voip-backend
; sudo supervisorctl restart voip-backend
;
; Check status with:
; sudo supervisorctl status voip-backend
