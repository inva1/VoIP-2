# Nginx Configuration for VoIP User Application
# Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)
#
# This file would typically be placed in /etc/nginx/sites-available/voip-user-app
# and then symlinked to /etc/nginx/sites-enabled/voip-user-app
#
# Assumes backend Flask/Gunicorn servers are running and accessible.
# Assumes SSL certificates are available (e.g., via Let's Encrypt).

# Upstream for backend API servers (Flask/Gunicorn)
upstream backend_servers {
    least_conn; # Distributes requests to server with fewest active connections
    # List your backend server instances.
    # Replace with actual internal IPs/ports of your Gunicorn workers.
    server 10.0.1.10:5000 max_fails=3 fail_timeout=30s;
    server 10.0.1.11:5000 max_fails=3 fail_timeout=30s;
    server 10.0.1.12:5000 max_fails=3 fail_timeout=30s;
    # Add more servers if needed for scaling.
    # Consider using a dynamic discovery method if servers change frequently.
}

# HTTP server block: Redirect all HTTP requests to HTTPS
server {
    listen 80;
    listen [::]:80; # Listen on IPv6 as well
    server_name app.voipconnect.com; # Replace with your actual domain

    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server block: Main configuration for the user application
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2; # Listen on IPv6 with SSL and HTTP/2
    server_name app.voipconnect.com; # Replace with your actual domain

    # SSL Configuration
    # Replace paths with your actual certificate and key file locations.
    # Example uses Let's Encrypt paths.
    ssl_certificate /etc/letsencrypt/live/app.voipconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.voipconnect.com/privkey.pem;

    # SSL hardening - based on modern practices and document recommendations
    ssl_protocols TLSv1.2 TLSv1.3;
    # Strong cipher suite (example from Mozilla Intermediate compatibility)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off; # Usually 'on' is recommended, but doc says 'off'. Let's clarify.
                                  # 'on' means server dictates cipher choice from client's list.
                                  # 'off' means client dictates from server's list.
                                  # Sticking to document: off.
    ssl_session_cache shared:SSL:10m; # 10MB shared cache for SSL sessions
    ssl_session_timeout 10m;          # Keep sessions for 10 minutes
    ssl_session_tickets off;          # Disable SSL session tickets for better Perfect Forward Secrecy (PFS)
    ssl_stapling on;                  # Enable OCSP stapling
    ssl_stapling_verify on;           # Verify OCSP responses
    # resolver 8.8.8.8 8.8.4.4 valid=300s; # DNS resolvers for OCSP stapling (use your preferred ones)
    # resolver_timeout 5s;

    # Security Headers (as specified in the document)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always; # Deprecated by modern browsers, CSP is preferred
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always; # Good default
    # Content Security Policy (CSP) - This is a basic example.
    # Needs to be carefully crafted based on actual application resources.
    # 'unsafe-inline' is often needed for styles/scripts initially but should be minimized.
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://cdn.example.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:;" always;
    # The document has a simpler CSP: "default-src 'self' http: https: data: blob: 'unsafe-inline'"
    # Using the document's version for now:
    # add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    # Re-evaluating the document's CSP: It allows http: and https: broadly.
    # A tighter policy is better. For example:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://trusted-cdn.com; style-src 'self' https://trusted-fonts.com; img-src 'self' data:; font-src 'self' https://trusted-fonts.com; connect-src 'self' wss://app.voipconnect.com https://api.voipconnect.com;" always;
    # Using the one from the document for now as requested by the prompt ("exactly as designed").
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; # HSTS

    # Document root for the frontend application (e.g., React, Angular, Vue build output)
    # Replace with the actual path to your frontend app's 'dist' or 'build' directory.
    root /opt/voip-user-app-enhanced/dist;
    index index.html index.htm;

    # Gzip compression for text-based assets
    gzip on;
    gzip_vary on; # Adds 'Vary: Accept-Encoding' header
    gzip_min_length 1024; # Don't compress small files
    gzip_proxied expired no-cache no-store private auth; # Compress for all proxied requests
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/xml+rss application/javascript application/json;

    # Handle client-side routing (for SPAs like React, Angular, Vue)
    # All non-file/non-API requests serve index.html to let client router handle it.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend Flask/Gunicorn servers
    location /api/ {
        proxy_pass http://backend_servers; # Pass to the upstream group

        # Proxy headers - important for backend to see correct client info
        proxy_set_header Host $host; # Preserve original host
        proxy_set_header X-Real-IP $remote_addr; # Real client IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # List of IPs if multiple proxies
        proxy_set_header X-Forwarded-Proto $scheme; # http or https

        # Proxy timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s; # Adjust if some API calls are long-running

        # Other proxy settings (optional)
        # proxy_buffering on;
        # proxy_buffer_size 16k;
        # proxy_buffers 4 32k;
    }

    # WebSocket proxy for real-time features (e.g., signaling for WebRTC)
    # Assumes backend handles WebSocket connections on a path like /ws/
    location /ws/ {
        proxy_pass http://backend_servers; # Or a dedicated WebSocket upstream if different

        # Required headers for WebSocket proxying
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Pass original client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for persistent WebSocket connections
        proxy_connect_timeout 7d; # 7 days (or shorter like 60s if re-connects are handled well)
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        # proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        # proxy_set_header Sec-WebSocket-Extensions $http_sec_websocket_extensions;
    }

    # Static assets caching policy
    # Cache common static file types for a long time (immutable if versioned in filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y; # Cache for 1 year
        add_header Cache-Control "public, immutable"; # Mark as immutable if filenames are hashed
                                                    # If not hashed, use "public, max-age=..."
        access_log off; # Optional: disable access logging for static assets
    }

    # Security: Deny access to hidden files (e.g., .htaccess, .git)
    location ~ /\. {
        deny all;
    }

    # Optional: Custom error pages
    # error_page 404 /404.html;
    # location = /404.html {
    #     internal;
    #     root /path/to/custom/error/pages;
    # }
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     internal;
    #     root /path/to/custom/error/pages;
    # }
}

# Notes:
# - Ensure the user Nginx runs as (e.g., www-data) has read access to:
#   - SSL certificate files
#   - Frontend application root directory (/opt/voip-user-app-enhanced/dist)
# - After creating/modifying this file:
#   1. Test Nginx configuration: `sudo nginx -t`
#   2. If successful, reload Nginx: `sudo systemctl reload nginx`
# - Placeholder `app.voipconnect.com` should be replaced with the actual domain.
# - Placeholder `10.0.1.10:5000` etc. for backend servers should be actual IPs/ports.
# - The path `/opt/voip-user-app-enhanced/dist` is where the built frontend application (e.g., from `npm run build`) should be deployed.
# - The CSP policy is taken directly from the document. It's broad; consider tightening it for production.
# - `ssl_prefer_server_ciphers off;` is per document. `on` is more common.
# - `ssl_stapling` requires `resolver` to be set for Nginx to fetch OCSP responses.
#   The document's Nginx config for User App doesn't show `resolver`, but the general SSL/TLS section does. Added it commented out.
# - `X-XSS-Protection` is deprecated but included as per doc. CSP's `script-src` is the modern way.
