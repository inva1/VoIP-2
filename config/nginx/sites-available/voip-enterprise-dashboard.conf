# Nginx Configuration for VoIP Enterprise Dashboard
# Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)
#
# This file would typically be placed in /etc/nginx/sites-available/voip-enterprise-dashboard
# and then symlinked to /etc/nginx/sites-enabled/voip-enterprise-dashboard
#
# Assumes backend Flask/Gunicorn servers are running and accessible.
# Assumes SSL certificates are available.

# Upstream for backend API servers (Flask/Gunicorn) - can be the same as user app's backend
# Or a dedicated one if the API for admin is different. Assuming same for now.
upstream backend_servers_admin { # Using a different name in case it needs to be distinct
    least_conn;
    server 10.0.1.10:5000 max_fails=3 fail_timeout=30s;
    server 10.0.1.11:5000 max_fails=3 fail_timeout=30s;
    server 10.0.1.12:5000 max_fails=3 fail_timeout=30s;
}

# HTTP server block: Redirect all HTTP requests to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name admin.voipconnect.com; # Replace with your actual admin domain

    return 301 https://$server_name$request_uri;
}

# HTTPS server block: Main configuration for the enterprise dashboard
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.voipconnect.com; # Replace with your actual admin domain

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/admin.voipconnect.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.voipconnect.com/privkey.pem;

    # SSL hardening (similar to user app, but can be stricter if needed)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off; # Per document; 'on' is often recommended.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    # resolver 8.8.8.8 8.8.4.4 valid=300s; # DNS resolvers for OCSP, use your preferred
    # resolver_timeout 5s;

    # Enhanced security headers for admin interface (as specified in the document)
    add_header X-Frame-Options "DENY" always; # Stricter than SAMEORIGIN
    add_header X-XSS-Protection "1; mode=block" always; # Deprecated, use CSP
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always; # Good strict default
    # Content Security Policy (CSP) for admin - more restrictive
    # The document specifies: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;"
    # This allows inline scripts/styles which is not ideal but often a starting point.
    # 'unsafe-inline' should be removed if possible by refactoring to use external files or nonces/hashes.
    # 'img-src data: https:' allows images from self, data URIs, and any HTTPS source. Tighten if possible.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:;" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always; # HSTS

    # IP whitelist for admin access (optional, as per document)
    # Deny all by default, then allow specific IPs/ranges.
    # allow 203.0.113.0/24;  # Example: Office network
    # allow 198.51.100.0/24;  # Example: VPN network
    # deny all;               # This must be the last entry in this block if used.
                              # If IP whitelist is active, only allowed IPs can access anything here.
                              # Order matters: allow rules first, then deny all.

    # Document root for the enterprise dashboard frontend application
    root /opt/voip-enterprise-dashboard-enhanced/dist;
    index index.html index.htm;

    # Authentication for admin interface (HTTP Basic Auth)
    # This provides an additional layer of security before accessing the application.
    # Ensure the .htpasswd file is secured and Nginx user can read it.
    auth_basic "VoIP Admin Dashboard"; # Realm message for the auth prompt
    auth_basic_user_file /etc/nginx/.htpasswd; # Path to htpasswd file
                                            # Create this file using `htpasswd` utility.
                                            # e.g., sudo htpasswd -c /etc/nginx/.htpasswd admin_user

    # Handle client-side routing for the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy to backend with admin authentication context
    # The backend should verify the $remote_user if HTTP Basic Auth is used for API auth as well,
    # or use a different mechanism like JWT tokens obtained after initial login.
    location /api/ {
        # If IP whitelist is used globally, it applies here too.
        # If finer-grained IP control for API:
        # allow 203.0.113.0/24;
        # allow 198.51.100.0/24;
        # deny all;

        proxy_pass http://backend_servers_admin; # Use the admin-specific or shared upstream

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass the authenticated user from HTTP Basic Auth to the backend
        # The backend API can then use this for authorization.
        proxy_set_header X-Admin-User $remote_user; # $remote_user is set by auth_basic

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Static assets caching policy (similar to user app)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}

# Notes:
# - Replace `admin.voipconnect.com` with your actual admin domain.
# - Replace backend server IPs/ports if different for admin.
# - Path `/opt/voip-enterprise-dashboard-enhanced/dist` is for the built admin frontend.
# - Create `/etc/nginx/.htpasswd` using `htpasswd` utility. Secure this file.
# - The IP whitelist (`allow`/`deny`) is commented out; uncomment and configure if needed.
#   If using it, ensure it's correctly placed to protect the intended locations.
#   The document places it globally for the server block.
# - The CSP is per document. Consider tightening 'unsafe-inline' and 'img-src https:'.
# - `ssl_prefer_server_ciphers off;` is per document.
# - `ssl_stapling` requires `resolver`.
# - Test Nginx config (`sudo nginx -t`) and reload (`sudo systemctl reload nginx`).
