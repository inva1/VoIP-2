# Nginx SSL/TLS Hardening Configuration Snippet
# Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)
#
# This file can be included in the http block of nginx.conf or specific server blocks.
# Example: include /etc/nginx/snippets/ssl_hardening.conf;
#
# These settings are generally already present in the voip-user-app.conf
# and voip-enterprise-dashboard.conf created earlier, but this file
# centralizes the SSL/TLS specific hardening aspects as per the "Security Hardening" section.

# SSL/TLS Protocols
# Enable TLSv1.2 and TLSv1.3. Disable older, insecure protocols like SSLv3, TLSv1.0, TLSv1.1.
ssl_protocols TLSv1.2 TLSv1.3;

# SSL Ciphers
# Define a strong cipher suite. The example from the document is:
# ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384
# A more modern suite (e.g., from Mozilla Intermediate compatibility) might be:
# ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
# Using the one from the document's "Nginx SSL Configuration" snippet:
ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;

# Server Cipher Preference
# 'on' means Nginx prefers its own cipher order over the client's.
# The document example for User App and Dashboard has 'off', but the dedicated SSL/TLS section has 'on'.
# 'on' is generally recommended for security.
ssl_prefer_server_ciphers on; # Changed to 'on' as per "Security Hardening" section's intent.

# SSL Session Cache
# Enable a shared session cache for SSL session resumption.
ssl_session_cache shared:SSL:10m; # 10MB cache, can store ~40,000 sessions.
ssl_session_timeout 10m;          # Clients can reuse sessions for 10 minutes.

# SSL Session Tickets
# Disable session tickets if Perfect Forward Secrecy (PFS) is a high priority,
# as tickets can sometimes weaken PFS. However, they improve performance for returning clients.
# The document's "Nginx SSL Configuration" snippet has `ssl_session_tickets off;`
ssl_session_tickets off;

# OCSP Stapling
# Enable OCSP stapling to improve SSL handshake performance and privacy for clients.
# Nginx will query the OCSP responder and cache the response.
ssl_stapling on;
ssl_stapling_verify on; # Verify the OCSP responses.

# Trusted Certificate for OCSP Stapling
# Path to the certificate chain file (intermediate + root CA).
# This should be the chain for your server's certificate.
# Example: /etc/letsencrypt/live/yourdomain.com/chain.pem
# The document uses `voipconnect.com` as an example domain.
ssl_trusted_certificate /etc/letsencrypt/live/voipconnect.com/chain.pem; # Replace with actual path/domain

# DNS Resolver for OCSP Stapling
# Nginx needs a resolver to query OCSP responders.
# Use reliable DNS servers.
resolver 8.8.8.8 8.8.4.4 1.1.1.1 valid=300s; # Google & Cloudflare DNS
resolver_timeout 5s;

# Security Headers (also present in site configs, but reiterated here for completeness of SSL section)

# HTTP Strict Transport Security (HSTS)
# Instructs browsers to only connect via HTTPS for the specified duration.
# 'preload' allows submission to browser HSTS preload lists.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# X-Frame-Options
# Protects against clickjacking attacks.
# 'SAMEORIGIN' allows framing only by pages from the same origin.
# 'DENY' for admin dashboard is even stricter.
add_header X-Frame-Options "SAMEORIGIN" always; # Default, can be overridden to DENY

# X-Content-Type-Options
# Prevents browsers from MIME-sniffing the content type.
add_header X-Content-Type-Options "nosniff" always;

# X-XSS-Protection (Deprecated)
# This header is largely superseded by Content Security Policy (CSP).
# Some older browsers might still use it.
add_header X-XSS-Protection "1; mode=block" always;

# Referrer-Policy
# Controls how much referrer information is sent with requests.
add_header Referrer-Policy "strict-origin-when-cross-origin" always; # Good balance

# Content Security Policy (CSP) - Defined per application (user-app vs admin-dashboard)
# add_header Content-Security-Policy "..." always; # This should be specific to the application.

# Diffie-Hellman Parameters (Optional, for DHE ciphers)
# If using DHE ciphers (less common now than ECDHE), provide strong DH parameters.
# Generate with: openssl dhparam -out /etc/nginx/dhparam.pem 2048 (or 4096)
# ssl_dhparam /etc/nginx/dhparam.pem;

# Notes:
# - Ensure paths to SSL certificates (`ssl_certificate`, `ssl_certificate_key`, `ssl_trusted_certificate`)
#   are correct in the actual server blocks.
# - The `ssl_ciphers` list should be periodically reviewed and updated based on current best practices.
# - HSTS `preload` requires careful consideration, as it's hard to undo.
# - This snippet focuses on SSL/TLS. Other security aspects (firewall, WAF, rate limiting) are separate.
# - If using Nginx as a reverse proxy, ensure it's passing correct `X-Forwarded-Proto https` to backends.
#   This is already handled in the proxy_pass sections of the site configs.
