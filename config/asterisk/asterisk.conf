; Asterisk General Configuration File for VoIP Business Solution
; Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)
;
; This file typically resides at /etc/asterisk/asterisk.conf

[directories](!) ; Use (!) to prevent modification through AMI/CLI
astetcdir => /etc/asterisk
astmoddir => /usr/lib/asterisk/modules
astvarlibdir => /var/lib/asterisk
astdbdir => /var/lib/asterisk      ; Location of the Asterisk internal database (astdb)
astkeydir => /var/lib/asterisk     ; For RSA keys used in IAX2 authentication
astdatadir => /var/lib/asterisk    ; For sound prompts and other data files
astagidir => /var/lib/asterisk/agi-bin
astspooldir => /var/spool/asterisk
astrundir => /var/run/asterisk     ; For PID file and control socket
astlogdir => /var/log/asterisk     ; For Asterisk log files
astsbindir => /usr/sbin            ; Location of Asterisk executables (e.g. safe_asterisk)

[options]
; General Options
verbose = 3                ; Console verbosity (0-4 typical, higher for more detail)
debug = 3                  ; Console debug level (0-4 typical)
;alwaysfork = yes           ; Fork into background (daemonize) - Deprecated, use -F or -f with safe_asterisk
;nofork = no                ; Do not fork (run in foreground) - Use -f with asterisk command
quiet = no                 ; Reduce console output (opposite of verbose)
timestamp = yes            ; Prefix console output with timestamps
execincludes = yes         ; Allow #exec in configuration files (use with caution)
console = yes              ; Enable console output when running in background (if not using -c with asterisk)
highpriority = yes         ; Run with high process priority (requires root or capabilities)
initcrypto = yes           ; Initialize crypto keys at startup (for IAX2, etc.)
nocolor = no               ; Disable colors in console output
dontwarn = no              ; Disable warnings for certain conditions (not recommended)
dumpcore = no              ; Create a core dump on crash (useful for debugging, ensure ulimits allow)
languageprefix = yes       ; Use language prefix for sound files (e.g., en/filename)
systemname = voip-asterisk-01 ; System name, useful for multi-server setups (can be set in sip.conf for Realtime)
autosystemname = no        ; Automatically set systemname from hostname (deprecated)

; Call Detail Record (CDR) Options
; cdr makenew = yes            ; Create new CDRs even if one exists for the channel (rarely needed)

; Advanced Options
mindtmfduration = 80       ; Minimum DTMF duration in ms (default 80)
;maxcalls = 1000            ; Maximum number of concurrent calls (default no limit, depends on hardware)
;maxload = 0.9              ; Asterisk will stop accepting new calls if load average exceeds this
;maxfiles = 1000            ; Maximum number of open file descriptors (ensure ulimit is higher)
;minmemfree = 1             ; Minimum free memory in MB (Asterisk stops if below this)
defaultlanguage = en       ; Default language for prompts if not specified by channel
documentation_language = en_US ; Language for CLI command documentation

; Security Options (some are better set in specific module configs like sip.conf)
;hidepower = yes            ; Hide "powered by Asterisk" messages
allowtransfer = yes        ; Allow call transfers (can be controlled more granularly)

; RTP Options (defaults are usually fine, can be overridden in rtp.conf)
;rtpstart = 10000           ; Start of RTP port range
;rtpend = 20000             ; End of RTP port range

; Internal timing options
; internal_timing = no     ; Use internal timing source (yes if DAHDI/timing source not available)
                           ; If you have DAHDI, it provides timing. If not, set to yes.
                           ; For a pure SIP system without DAHDI hardware, set to yes.
internal_timing = yes      ; Assuming no DAHDI hardware for timing in a typical cloud setup.

; Default context for new channels if not specified
; defaultcontext = default   ; This is often set in channel driver configs (e.g., sip.conf)

; Transcoding
; transcode_via_slin = yes   ; Transcode via signed linear first (default)
; codec_priority = opus,g722,ulaw,alaw,g729,gsm ; Example global codec priority (can be set in sip.conf)

; Live AGI (Advanced Gateway Interface)
; agiwanip = x.x.x.x         ; If AGI server is remote and needs to know public IP

; Manager (AMI) Options (better configured in manager.conf)
; managerport = 5038
; manageraddr = 127.0.0.1

; HTTP Server (ARI) Options (better configured in http.conf or ari.conf)
; httpaddr = 0.0.0.0
; httpport = 8088

; This file is often kept minimal, with most configurations in module-specific files.
; The deployment guide example is also quite minimal.
; Ensure that the user Asterisk runs as (e.g., 'asterisk') has permissions to these directories.
