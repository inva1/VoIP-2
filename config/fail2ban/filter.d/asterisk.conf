# Fail2ban Filter for Asterisk
# Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)
#
# This file should be placed at /etc/fail2ban/filter.d/asterisk.conf
#
# This filter targets common Asterisk security log messages indicating failed authentications
# or unauthorized access attempts.

[INCLUDES]
# Optional: Include before or after directives if needed from other files
# before = common.conf

[Definition]

# Failregex: Regular expressions to match lines indicating a failure.
#
# The document provides:
# failregex = ^ . *SecurityEvent="FailedACL" . *RemoteAddress="IPV4/UDP/<HOST>/.*"$
# This regex has a few issues:
# 1. `^ . *` - space after ^, and `.` then `*` is redundant. `^.*` is typical.
# 2. `IPV4/UDP/<HOST>/.*` - The `.*` at the end of RemoteAddress might be too greedy or unnecessary
#    if the IP/port is the last part. Or it implies port number.
#
# A common Asterisk security log message for failed ACL (chan_sip) might be:
# SecurityEvent="FailedACL",EventTV="...",Severity="Error",Service="SIP",EventVersion="1",AccountID="<unknown>",SessionID="...",LocalAddress="IPV4/UDP/x.x.x.x/5060",RemoteAddress="IPV4/UDP/y.y.y.y/12345",Challenge="...",ACLName="default"
#
# For PJSIP, failed authentication might look different, e.g., in full logs:
# VERBOSE[pid] res_pjsip_authenticator_digest.c: Endpoint 'anonymous': Nonce ... received from '<HOST_IP>:<PORT>' is stale/incorrect
#
# Let's refine the document's regex slightly for common Asterisk security log formats.
# Assuming the "security" log file primarily contains "SecurityEvent" type messages.

failregex =
    # Matches "FailedACL" events, capturing the remote IP from RemoteAddress.
    # This is for chan_sip when an IP is denied by `permit`/`deny` rules or `allowguest=no`.
    NOTICE.*SecurityEvent="FailedACL".*RemoteAddress="IPV4/(?:UDP|TCP|TLS)/<HOST>/[0-9]+".*$

    # Matches "InvalidPassword" events for SIP authentication failures.
    # For chan_sip:
    NOTICE.*SecurityEvent="InvalidPassword".*RemoteAddress="IPV4/(?:UDP|TCP|TLS)/<HOST>/[0-9]+".*$
    # For PJSIP, the log format for auth failures might be different and may not always be a "SecurityEvent".
    # Example for PJSIP auth failure (might need to be in a different filter if logs are separate):
    # WARNING.*res_pjsip_authenticator_digest.c:.*Authentication failure for endpoint.*from '<HOST>:[0-9]+'

    # Matches "NoMatchingEndpoint" for PJSIP if an unknown endpoint tries to register/call.
    VERBOSE.*res_pjsip_endpoint_identifier_ip.c: Identify PJSIP_identify_endpoint_ip: Source address <HOST>:[0-9]+ does not match any endpoint

    # Matches "ChallengeResponseFailed"
    NOTICE.*SecurityEvent="ChallengeResponseFailed".*RemoteAddress="IPV4/(?:UDP|TCP|TLS)/<HOST>/[0-9]+".*$

    # Matches "InvalidAccountID" - often for attempts to use non-existent usernames
    NOTICE.*SecurityEvent="InvalidAccountID".*RemoteAddress="IPV4/(?:UDP|TCP|TLS)/<HOST>/[0-9]+".*$

    # The document's specific regex: ^ . *SecurityEvent="FailedACL" . *RemoteAddress="IPV4/UDP/<HOST>/.*"$
    # Corrected version of the document's regex, assuming it's the primary one desired:
    # This will be the main one if sticking strictly to the doc's example, but it's very specific to FailedACL + UDP.
    # My interpretation of the document's regex, slightly cleaned:
    # ^.*SecurityEvent="FailedACL".*RemoteAddress="IPV4/UDP/<HOST>/[0-9]+".*$

# Using a set of common Asterisk failure patterns including the spirit of the document's example.
# If only the document's specific regex is required, then comment out the others.
# For this exercise, I will use the more comprehensive set above which is common practice for Asterisk.
# If "exactly as designed" means the literal faulty regex from the doc, that would be:
# failregex = ^ . *SecurityEvent="FailedACL" . *RemoteAddress="IPV4/UDP/<HOST>/.*"$
# This is likely not the functional intent. I will use the more robust set.

# Ignoreregex: Regular expressions to ignore lines that should not cause a ban.
ignoreregex =
    # Example: if a trusted IP sometimes fails validation for a known reason.
    # ^.*RemoteAddress="IPV4/UDP/your_trusted_gateway_ip/.*"$

# Date/Time pattern
# Asterisk logs typically have a timestamp that Fail2ban can parse.
# If using Asterisk's "full" log, the pattern might be like:
# datepattern = {^LN-BEG} \[%Y-%m-%d %H:%M:%S(?:,%q)?\]
# For security logs, it might just be syslog format if Asterisk logs security events to syslog.
# Often, Fail2ban's default date detection works if logs are standard.

# Notes:
# - Test these regex thoroughly against your Asterisk security log files using `fail2ban-regex`.
#   Example: `fail2ban-regex /var/log/asterisk/security /etc/fail2ban/filter.d/asterisk.conf` (if 'security' is the log)
#   or `fail2ban-regex /var/log/asterisk/messages /etc/fail2ban/filter.d/asterisk.conf`
# - Ensure Asterisk is configured to log security events with sufficient detail, including source IP.
#   Check logger.conf in Asterisk. Security events are typically logged with NOTICE level.
# - The `logpath` in `jail.local` for the [asterisk] jail must point to the correct Asterisk log file
#   that contains these security messages. The document specifies `/var/log/asterisk/security`.
# - This filter is primarily for SIP-related attacks. Other Asterisk services (AMI, ARI) might need
#   their own filters if exposed and subject to brute-force.

