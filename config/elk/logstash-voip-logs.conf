# Logstash Configuration File for VoIP Business Solution (ELK Stack)
# Based on VoIP Business Solution: Enhanced Deployment Guide (Version 2.0)
#
# This file would typically be placed in /etc/logstash/conf.d/voip-logs.conf
# Logstash will process all .conf files in this directory.

input {
  # Beats input: For receiving logs from Filebeat, Winlogbeat, etc.
  # Filebeat is commonly used to ship logs from servers to Logstash.
  beats {
    port => 5044
    # ssl => true # If using SSL between Filebeat and Logstash
    # ssl_certificate => "/path/to/logstash.crt"
    # ssl_key => "/path/to/logstash.key"
    # ssl_client_authentication => "none" # or "optional" or "required"
    # ssl_verify_mode => "peer"
  }

  # Syslog input: For receiving logs directly via syslog protocol
  # Useful for network devices or services that log via syslog.
  syslog {
    port => 514 # Standard syslog UDP port. Can also use TCP.
    type => "syslog" # Adds a 'type' field, can be used in filters
    # For TCP syslog:
    # protocol => "tcp"
    # port => 1514 # Example TCP port
  }

  # Add other inputs as needed, e.g., TCP, UDP, file, http_poller, etc.
  # Example: Direct TCP input for some applications
  # tcp {
  #   port => 5000
  #   codec => json_lines # Assuming logs are sent as JSON lines
  #   type => "app_tcp_logs"
  # }
}

filter {
  # Add a general field if not present, e.g., to identify the source environment
  # mutate {
  #   add_field => { "environment" => "production" }
  # }

  # Grok filter for VoIP backend application logs
  # Assumes logs are tagged with [fields][service] == "voip-backend" by Filebeat
  # or have a specific type if coming from another input.
  if [fields][service] == "voip-backend" or [type] == "voip-backend-log" {
    grok {
      # Example log format: "2025-07-05 10:00:00,123 INFO myapp.somemodule: Log message content"
      # Adjust the pattern to match your actual Flask application log format.
      # The one in the document: "%{TIMESTAMP_ISO8601:timestamp} %{LOGLEVEL:level} %{DATA:logger} %{GREEDYDATA:message}"
      match => { "message" => "%{TIMESTAMP_ISO8601:log_timestamp} %{LOGLEVEL:log_level} %{DATA:logger_name}: %{GREEDYDATA:log_message}" }
      add_field => { "parsed_by" => "grok_voip_backend" }
      # overwrite => ["message"] # Replace original message with log_message if desired
    }
    date {
      match => [ "log_timestamp", "ISO8601" ] # Parse log_timestamp into @timestamp
      target => "@timestamp"
    }
    # Further parsing for specific log messages if needed
    if [log_message] =~ /API Request/ {
      grok {
        match => { "log_message" => "API Request: %{WORD:http_method} %{URIPATHPARAM:http_endpoint} from %{IP:client_ip}" }
        add_tag => ["api_request"]
      }
    }
    if [log_message] =~ /Call Started/ {
      grok {
        match => { "log_message" => "Call Started: %{DATA:call_id} from %{DATA:caller_id} to %{DATA:called_id}" }
        add_tag => ["call_event", "call_started"]
      }
    }
    # Add more conditional parsing for other specific log patterns from voip-backend
  }

  # Grok filter for Kamailio logs (assuming they come via syslog)
  # Kamailio logs often have a specific syslog format.
  else if [fields][service] == "kamailio" or [program] == "kamailio" or [type] == "syslog" and "kamailio" in [message] {
    grok {
      # Example Kamailio syslog line: "Jul  5 10:00:00 kamailio_host kamailio[1234]: INFO: <script>: Message"
      # The document's pattern: "%{SYSLOGTIMESTAMP:timestamp} %{WORD:hostname} %{WORD:process}: %{GREEDYDATA:message}"
      # This pattern is too generic for Kamailio process. Kamailio syslog usually includes PID.
      # A more specific pattern might be:
      # match => { "message" => "<%{POSINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{SYSLOGHOST:syslog_hostname} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:kamailio_message}" }
      # Using the document's simpler one for now:
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{HOSTNAME:syslog_hostname} %{DATA:syslog_program}(?:\[%{NUMBER:syslog_pid}\])?: %{GREEDYDATA:kamailio_message}" }
      add_field => { "parsed_by" => "grok_kamailio" }
      overwrite => ["message"] # Replace original syslog message with kamailio_message
    }
    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ] # Common syslog timestamp formats
      target => "@timestamp"
    }
    mutate {
      rename => { "kamailio_message" => "message" } # Put the core message back into 'message' field
    }
    # Add further parsing for specific Kamailio log content if needed
  }

  # Grok filter for Asterisk logs
  # Asterisk logs have various formats (full, messages, security).
  # Assuming Filebeat sends them with a field identifying them as Asterisk logs.
  else if [fields][service] == "asterisk" or [type] == "asterisk-log" {
    grok {
      # Document's pattern: "[%{TIMESTAMP_ISO8601:timestamp}] %{WORD:level} %{DATA:thread} %{DATA:module}: %{GREEDYDATA:message}"
      # This looks like it's for Asterisk 'full' log or similar.
      # Example: [2025-07-05 10:00:00.123] VERBOSE[12345][C-00000001] pbx.c: Executing [s@macro-dialout-trunk:13] ...
      # The pattern might need adjustment for Asterisk's actual verbose log format.
      # A common pattern: \[(?<timestamp>%{YEAR}-%{MONTHNUM}-%{MONTHDAY} %{TIME})\] %{LOGLEVEL:asterisk_level}\[%{BASE10NUM:thread_id}\](?:\[%{DATA:call_id}\])? %{DATA:source_file}: %{GREEDYDATA:asterisk_message}
      match => { "message" => "\[%{TIMESTAMP_ISO8601:log_timestamp}\] %{LOGLEVEL:log_level} \[%{DATA:thread_id}\](?:\[%{DATA:call_id_part}\])? %{DATA:source_file}(?:: %{DATA:source_line})?: %{GREEDYDATA:log_message}" }
      add_field => { "parsed_by" => "grok_asterisk" }
      # overwrite => ["message"]
    }
    date {
      match => [ "log_timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    mutate {
      rename => { "log_message" => "message" }
    }
    # Add parsing for specific Asterisk events if needed
  }

  # General cleanup and type conversion
  mutate {
    # Remove fields added by Filebeat if not needed after processing
    # remove_field => ["beat", "input_type", "offset", "prospector", "source"]
    # Convert fields to appropriate types if necessary
    # convert => { "response_time_ms" => "integer" }
  }

  # If geoip is desired for client_ip
  # if [client_ip] {
  #   geoip {
  #     source => "client_ip"
  #     # database => "/path/to/GeoLite2-City.mmdb" # Download from MaxMind
  #   }
  # }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch-01:9200", "http://elasticsearch-02:9200", "http://elasticsearch-03:9200"]
    index => "voip-logs-%{+YYYY.MM.dd}" # Daily indices
    # user => "logstash_writer" # If Elasticsearch security is enabled
    # password => "logstash_password" # Store securely, e.g., Logstash Keystore
    # ssl => true # If Elasticsearch uses HTTPS
    # cacert => "/path/to/elasticsearch_ca.crt" # If using self-signed certs for ES
    # manage_template => true
    # template_name => "voip-logs-template"
    # template => "/etc/logstash/templates/voip-logs-template.json" # Define a template for mapping
  }

  # Conditional output for critical errors to email (example from document)
  if [log_level] == "ERROR" or [log_level] == "CRITICAL" or "error" in [tags] {
    email {
      to => "alerts@voipconnect.com"
      from => "logstash-alerts@voipconnect.com"
      subject => "VoIP System Alert: %{log_level} in %{[fields][service]|%{[program]}|unknown_service}"
      body => "Error details:\nTimestamp: %{@timestamp}\nService: %{[fields][service]|%{[program]}|%{type}|unknown}\nHost: %{[agent][hostname]|%{[host][hostname]}|unknown}\nMessage: %{message}\n\nFull Log Event:\n%{event}"
      # SMTP server settings (usually configured in logstash.yml or environment variables)
      # address => "smtp.example.com"
      # port => 587
      # username => "smtp_user"
      # password => "smtp_password"
      # authentication => "plain"
      # use_tls => true
    }
  }

  # For debugging, output to stdout (remove in production)
  # stdout { codec => rubydebug }
}

# Notes:
# - Replace `elasticsearch-01:9200`, etc., with your actual Elasticsearch node addresses.
# - If Elasticsearch security is enabled (as per elasticsearch.yml), configure user/password for Logstash.
#   Use Logstash Keystore for secure credential storage.
# - Grok patterns are highly dependent on the exact log format. Test them thoroughly.
#   Use tools like Grok Debugger (online or in Kibana).
# - The `[fields][service]` relies on Filebeat adding this field based on its configuration.
#   Alternatively, use `[type]` or other tags set by inputs.
# - Email output requires SMTP server configuration.
# - Consider using Logstash pipeline-to-pipeline communication for more complex setups.
# - An Elasticsearch index template (`voip-logs-template.json`) is recommended to define mappings
#   (e.g., data types for fields like numbers, IPs, keywords) for better search and aggregation.
